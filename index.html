<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, user-scalable=no">
    <title>OlegTube — Социальная сеть</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body.light-theme {
            background: #edeef0;
            color: #2c3e50;
        }
        
        body.dark-theme {
            background: #121212;
            color: #e0e0e0;
        }
        
        #authScreen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        .auth-container {
            width: 100%;
            border-radius: 8px;
            padding: 40px 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            background: white;
        }
        
        body.dark-theme .auth-container {
            background: #1e1e1e;
            color: #e0e0e0;
        }
        
        .auth-container h2 { 
            text-align: center; 
            color: #2a5885; 
            margin-bottom: 32px;
            font-size: 28px;
        }
        
        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #d3d9de;
            border-radius: 4px;
            font-size: 16px;
            background: white;
            color: #2c3e50;
        }
        
        body.dark-theme .auth-input {
            background: #2d2d2d;
            color: #e0e0e0;
            border-color: #444;
        }
        
        .auth-input:focus { outline: none; border-color: #2a5885; }
        
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            -webkit-appearance: none;
        }
        
        .auth-btn:hover { background: #1e3e5f; }
        .auth-btn:active { transform: scale(0.98); }
        
        .switch-btn { background: none; color: #2a5885; border: 1px solid #2a5885; }
        .switch-btn:hover { background: #e5ebf1; }
        
        .error-msg { color: #e64646; text-align: center; margin-bottom: 12px; font-size: 14px; }
        .success-msg { color: #4bb34b; text-align: center; margin-bottom: 12px; font-size: 14px; }
        
        body.light-theme .post-card,
        body.light-theme .profile-card,
        body.light-theme .chat-list,
        body.light-theme .menu-item,
        body.light-theme .chat-item,
        body.light-theme .search-result-item,
        body.light-theme .modal-card,
        body.light-theme .edit-profile-card,
        body.light-theme .settings-panel {
            background: white;
            color: #2c3e50;
        }
        
        body.dark-theme .post-card,
        body.dark-theme .profile-card,
        body.dark-theme .chat-list,
        body.dark-theme .menu-item,
        body.dark-theme .chat-item,
        body.dark-theme .search-result-item,
        body.dark-theme .modal-card,
        body.dark-theme .edit-profile-card,
        body.dark-theme .settings-panel {
            background: #1e1e1e;
            color: #e0e0e0;
        }
        
        body.dark-theme .comment {
            background: #2d2d2d;
        }
        
        body.dark-theme .header {
            background: #0d2137;
        }
        
        body.dark-theme .chat-container {
            background: #1e1e1e;
        }
        
        body.dark-theme .chat-messages {
            background: #121212;
        }
        
        body.dark-theme .chat-message.in {
            background: #2d2d2d;
            color: #e0e0e0;
        }
        
        body.dark-theme .chat-input-area {
            background: #1e1e1e;
            border-color: #333;
        }
        
        .call-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .call-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .call-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }
        .call-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .call-card {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            min-width: 300px;
            max-width: 400px;
            width: 90%;
        }
        .call-avatar {
            width: 100px;
            height: 100px;
            background: #2a5885;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background-size: cover;
            background-position: center;
        }
        .call-name {
            font-size: 24px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }
        .call-status {
            color: #aaa;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .call-timer {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
            font-family: monospace;
        }
        .call-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .call-action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .call-action-btn:active {
            transform: scale(0.9);
        }
        .call-action-btn.accept {
            background: #4bb34b;
            color: white;
        }
        .call-action-btn.decline {
            background: #e64646;
            color: white;
        }
        .call-action-btn.end {
            background: #e64646;
            color: white;
        }
        .call-action-btn.mic {
            background: #2a5885;
            color: white;
        }
        .call-action-btn.mic.muted {
            background: #e64646;
        }
        .call-action-btn.speaker {
            background: #2a5885;
            color: white;
        }
        .call-action-btn.speaker.active {
            background: #4bb34b;
        }
        .call-btn-label {
            color: white;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .call-action-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2a5885;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .settings-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .main-layout {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 16px;
            gap: 16px;
            position: relative;
            align-items: flex-start;
        }
        
        .left-menu {
            width: 200px;
            flex-shrink: 0;
            position: sticky;
            top: 60px;
            align-self: flex-start;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-item i { width: 20px; }
        .menu-item:hover { background: #e5ebf1; opacity: 0.8; }
        .menu-item:active { transform: scale(0.97); }
        .menu-item.active { background: #e5ebf1; font-weight: 500; }
        
        body.dark-theme .menu-item.active {
            background: #333;
        }
        
        .content-panel {
            flex: 1;
            min-width: 0;
        }
        
        .post-card {
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        .post-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .post-author-info { flex: 1; }
        .post-author-name {
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .post-author-username {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .post-date {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 2px;
        }
        .post-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 12px;
            word-break: break-word;
        }
        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .post-image {
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            min-height: 120px;
        }
        .post-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .post-actions {
            display: flex;
            gap: 24px;
            padding-top: 8px;
            border-top: 1px solid;
        }
        .post-action {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .post-action:active { background: rgba(0,0,0,0.05); }
        .post-action:hover { color: #2a5885; }
        
        .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid;
        }
        .comment {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px;
            border-radius: 8px;
        }
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .comment-content { flex: 1; }
        .comment-author {
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .comment-username { font-size: 10px; opacity: 0.6; }
        .comment-text { font-size: 12px; margin-top: 2px; word-break: break-word; }
        .comment-date { font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .add-comment {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-comment input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            border: 1px solid;
        }
        .add-comment button {
            padding: 6px 12px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .show-comments-btn {
            font-size: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .show-comments-btn:active { background: rgba(0,0,0,0.05); }
        
        .profile-card {
            border-radius: 4px;
            overflow: hidden;
        }
        .profile-cover {
            height: 120px;
            background: linear-gradient(135deg, #2a5885, #1e3e5f);
            position: relative;
        }
        .profile-info {
            padding: 16px;
            text-align: center;
            margin-top: -40px;
            position: relative;
            z-index: 1;
        }
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: bold;
            border: 4px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
        }
        .avatar-edit-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #2a5885;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid white;
            cursor: pointer;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .profile-username { font-size: 14px; opacity: 0.6; margin-bottom: 8px; }
        .profile-bio { font-size: 13px; margin: 8px 0; padding: 0 16px; }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 16px;
            border-top: 1px solid;
            border-bottom: 1px solid;
            margin: 16px 0;
        }
        .profile-stat { text-align: center; }
        .profile-stat-number { font-size: 18px; font-weight: 600; }
        .profile-stat-label { font-size: 12px; opacity: 0.6; }
        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 0 16px 16px;
            flex-wrap: wrap;
        }
        .profile-btn {
            padding: 10px 24px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .profile-btn:active { transform: scale(0.97); }
        .profile-btn.secondary {
            background: #e5ebf1;
            color: #2a5885;
        }
        .profile-btn.subscribed {
            background: #6c7a8e;
            color: white;
        }
        .profile-back-btn {
            background: none;
            text-align: left;
            padding: 12px 16px;
            display: inline-block;
            width: auto;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .profile-posts { padding: 16px; }
        .profile-posts h4 { margin-bottom: 12px; }
        
        .settings-panel {
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }
        .settings-section {
            padding: 20px;
            border-bottom: 1px solid #edeef0;
        }
        .settings-section:last-child { border-bottom: none; }
        .settings-section h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .settings-item span { font-size: 16px; }
        .theme-toggle, .sound-toggle {
            width: 50px;
            height: 26px;
            background: #2a5885;
            border-radius: 26px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle.active, .sound-toggle.active { background: #4bb34b; }
        .theme-toggle::after, .sound-toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .theme-toggle.active::after, .sound-toggle.active::after { left: 26px; }
        .edit-profile-settings-btn {
            background: #2a5885;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        .edit-profile-settings-btn:active { transform: scale(0.98); }
        
        .chat-list { border-radius: 4px; }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-item:active { background: rgba(0,0,0,0.05); }
        .chat-item:hover { opacity: 0.8; }
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .chat-username { font-size: 11px; opacity: 0.6; font-weight: normal; }
        .chat-last-msg { font-size: 12px; opacity: 0.6; }
        
        .search-input {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 16px;
            border: 1px solid;
        }
        .search-result-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .search-result-item:active { background: rgba(0,0,0,0.05); }
        .search-result-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .search-result-info { flex: 1; }
        .search-result-name { font-weight: 600; }
        .search-result-username { font-size: 12px; opacity: 0.6; }
        
        .new-chat-btn {
            background: #2a5885;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .new-chat-btn:active { transform: scale(0.98); }
        
        .hide { display: none; }
        .loading { text-align: center; padding: 40px; opacity: 0.6; }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            border-radius: 4px;
            overflow: hidden;
        }
        .chat-header {
            background: #2a5885;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .chat-header .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-header .chat-user-info { flex: 1; }
        .chat-header .chat-user-name { font-size: 18px; font-weight: 600; }
        .chat-header .chat-user-username { font-size: 12px; opacity: 0.8; }
        .chat-header-actions {
            display: flex;
            gap: 12px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            border: 1px solid;
        }
        .chat-input-area button {
            background: #2a5885;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 14px;

<script type="module">

    const firebaseConfig = {

    let currentUser = null;

    // ========== УЛУЧШЕННАЯ СИСТЕМА ЗВОНКОВ ==========
    
    // Расширенная конфигурация ICE с множеством серверов
    const iceConfiguration = {
        iceServers: [

            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },

                ],
                username: 'efvBQNPQHDEKXKAH',

            { 
                urls: [
                    'turn:global.relay.metered.ca:80',

    let iceRestartAttempts = 0;
    const MAX_ICE_RESTARTS = 3;
    
    // Улучшенный захват аудио с несколькими попытками
    async function getAudioStreamWithFallback() {
        const audioConstraints = [
            {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                sampleRate: 44100,
                channelCount: 1
            },
            {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            true // Просто true как последняя попытка
        ];
        
        for (const constraints of audioConstraints) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: constraints 
                });
                console.log('Audio acquired with constraints:', constraints);
                return stream;
            } catch(e) {
                console.log('Audio constraint failed:', constraints, e.message);
            }
        }
        
        throw new Error('Не удалось получить доступ к микрофону. Проверьте разрешения.');
    }
    
    // Создание PeerConnection с улучшенными настройками
    function createPeerConnection() {
        const pc = new RTCPeerConnection(iceConfiguration);
        
        // Мониторинг ICE состояния
        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            console.log('ICE state:', state);
            
            if (state === 'failed' || state === 'disconnected') {
                if (iceRestartAttempts < MAX_ICE_RESTARTS) {
                    iceRestartAttempts++;
                    console.log(`ICE restart attempt ${iceRestartAttempts}`);
                    restartIce(pc);
                } else {
                    console.log('Max ICE restarts reached, ending call');
                    endCall();
                }
            }
            
            if (state === 'connected' || state === 'completed') {
                iceRestartAttempts = 0;
                if (currentCall && !currentCall.isActive) {
                    onCallConnected(currentCall.callId, currentCall.partnerName);
                }
            }
        };
        
        pc.onicecandidateerror = (event) => {
            console.log('ICE candidate error:', event);
            if (event.errorCode === 701) {
                console.log('TURN server unavailable, trying STUN only...');
            }
        };
        
        pc.onconnectionstatechange = () => {
            console.log('Connection state:', pc.connectionState);
            if (pc.connectionState === 'failed' || 
                pc.connectionState === 'disconnected' ||
                pc.connectionState === 'closed') {
                endCall();
            }
        };
        
        return pc;
    }
    
    // Перезапуск ICE
    async function restartIce(pc) {
        try {
            if (pc.connectionState !== 'closed' && 
                pc.connectionState !== 'failed') {
                await pc.restartIce();
                console.log('ICE restarted successfully');
            }
        } catch(e) {
            console.log('ICE restart failed:', e);
        }
    }
    
    // Основная функция старта звонка
    async function startCall(partnerName, isIncoming = false, callId = null) {
        if (currentCall) {
            showToast('У вас уже активен звонок');
            return;
        }
        
        try {
            console.log('Starting call to:', partnerName);
            
            // Проверяем доступность микрофона
            try {
                const testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                testStream.getTracks().forEach(track => track.stop());
            } catch(e) {
                showToast('Нет доступа к микрофону. Разрешите доступ в настройках браузера.');
                return;
            }
            
            // Получаем аудио поток
            localStream = await getAudioStreamWithFallback();
            console.log('Audio stream acquired');
            
            // Создаем PeerConnection
            peerConnection = createPeerConnection();
            
            // Добавляем треки
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            // Обработка удаленного потока
            peerConnection.ontrack = (event) => {
                console.log('Remote track received');
                if (event.streams.length > 0) {
                    if (remoteAudio) {
                        remoteAudio.srcObject = null;
                        remoteAudio.remove();
                    }
                    remoteAudio = new Audio();
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.autoplay = true;
                    remoteAudio.volume = 1.0;
                    remoteAudio.play().catch(e => console.log('Play error:', e));
                    
                    if (isSpeakerOn) setSpeakerMode(true);
                }
            };
            
            // Обработка ICE кандидатов
            peerConnection.onicecandidate = async (event) => {
                if (event.candidate) {
                    console.log('ICE candidate:', event.candidate.type);
                    const callRef = doc(db, "calls", callId || currentCall?.callId);
                    try {
                        const callSnap = await getDoc(callRef);
                        const callData = callSnap.data();
                        if (callData) {
                            const field = currentCall?.isIncoming ? 'iceCandidates_callee' : 'iceCandidates_caller';
                            const candidates = callData[field] || [];
                            candidates.push(event.candidate.toJSON());
                            await updateDoc(callRef, { [field]: candidates });
                        }
                    } catch(e) {
                        console.log('Error saving ICE candidate:', e);
                    }
                }
            };
            
            // Создаем или получаем ID звонка
            let actualCallId = callId;
            if (!actualCallId) {
                actualCallId = `${currentUser.username}_${partnerName}_${Date.now()}`;
                await setDoc(doc(db, "calls", actualCallId), {
                    caller: currentUser.username,
                    callee: partnerName,
                    status: 'calling',
                    startTime: new Date(),
                    iceCandidates_caller: [],
                    iceCandidates_callee: [],
                    offer: null,
                    answer: null,
                    createdAt: new Date()
                });
            }
            
            currentCall = { 
                callId: actualCallId, 
                partnerName, 
                isIncoming, 
                isActive: false 
            };
            
            // Если не входящий - создаем offer
            if (!isIncoming) {
                console.log('Creating offer...');
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await updateDoc(doc(db, "calls", actualCallId), { 
                    offer: offer.toJSON()
                });
                
                // Слушаем сигнализацию
                listenForSignaling(actualCallId, true);
            }
            
            // Показываем модалку
            showCallModal(partnerName, isIncoming ? 'incoming' : 'calling');
            if (isIncoming) playSound('call');
            
            // Таймаут для соединения (30 секунд)
            setTimeout(() => {
                if (currentCall && !currentCall.isActive) {
                    console.log('Connection timeout');
                    endCall();
                    showToast('Не удалось установить соединение');
                }
            }, 30000);
            
        } catch (err) {
            console.error('Call error:', err);
            showToast('Ошибка: ' + err.message);
            endCall();
        }
    }
    
    // Принять звонок
    async function acceptCall(callId, callerName) {
        try {
            console.log('Accepting call:', callId);
            const callRef = doc(db, "calls", callId);
            const callSnap = await getDoc(callRef);
            const callData = callSnap.data();
            
            if (!callData || callData.status === 'ended') {
                showToast('Звонок уже завершён');
                return;
            }
            
            // Проверяем доступность микрофона
            try {
                const testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                testStream.getTracks().forEach(track => track.stop());
            } catch(e) {
                showToast('Нет доступа к микрофону. Разрешите доступ в настройках браузера.');
                return;
            }
            
            // Получаем аудио поток
            localStream = await getAudioStreamWithFallback();
            
            // Создаем PeerConnection
            peerConnection = createPeerConnection();
            
            // Добавляем треки
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            // Устанавливаем удаленное описание
            if (callData.offer) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
            }
            
            // Добавляем ICE кандидаты звонящего
            const callerCandidates = callData.iceCandidates_caller || [];
            for (const candidate of callerCandidates) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch(e) {
                    console.log('Add ICE error:', e);
                }
            }
            
            // Создаем ответ
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await updateDoc(callRef, { answer: answer.toJSON(), status: 'connecting' });
            
            currentCall = { 
                callId, 
                partnerName: callerName, 
                isIncoming: false, 
                isActive: false 
            };
            
            // Обработка удаленного потока
            peerConnection.ontrack = (event) => {
                console.log('Remote track received');
                if (event.streams.length > 0) {
                    if (remoteAudio) {
                        remoteAudio.srcObject = null;
                        remoteAudio.remove();
                    }
                    remoteAudio = new Audio();
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.autoplay = true;
                    remoteAudio.volume = 1.0;
                    remoteAudio.play().catch(e => console.log('Play error:', e));
                    
                    if (isSpeakerOn) setSpeakerMode(true);
                }
            };
            
            // Обработка ICE кандидатов
            peerConnection.onicecandidate = async (event) => {
                if (event.candidate) {
                    try {
                        const snap = await getDoc(callRef);
                        const data = snap.data();
                        if (data) {
                            const candidates = data.iceCandidates_callee || [];
                            candidates.push(event.candidate.toJSON());
                            await updateDoc(callRef, { iceCandidates_callee: candidates });
                        }
                    } catch(e) {
                        console.log('Error saving ICE candidate:', e);
                    }
                }
            };
            
            // Слушаем сигнализацию
            listenForSignaling(callId, false);
            
            showCallModal(callerName, 'connecting');
            
            // Таймаут соединения
            setTimeout(() => {
                if (currentCall && !currentCall.isActive) {
                    console.log('Connection timeout');
                    endCall();
                    showToast('Не удалось установить соединение');
                }
            }, 30000);
            
        } catch (err) {
            console.error('Accept call error:', err);
            showToast('Ошибка при принятии звонка: ' + err.message);
            endCall();
        }
    }
    
    // Сигнализация
    function listenForSignaling(callId, isCaller) {
        const callRef = doc(db, "calls", callId);
        const unsubscribe = onSnapshot(callRef, async (snap) => {
            const data = snap.data();
            if (!data || !peerConnection) return;
            
            // Проверяем, не завершен ли звонок
            if (data.status === 'ended') {
                endCall();
                return;
            }
            
            const myField = isCaller ? 'iceCandidates_callee' : 'iceCandidates_caller';
            const remoteCandidates = data[myField] || [];
            
            // Добавляем ICE кандидаты
            for (const candidate of remoteCandidates) {
                try {
                    if (peerConnection.remoteDescription && peerConnection.connectionState !== 'closed') {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    }
                } catch(e) {
                    console.log('Add ICE error:', e);
                }
            }
            
            // Обработка offer/answer
            try {
                if (isCaller && data.answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    console.log('Remote description set from answer');
                }
                
                if (!isCaller && data.offer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    console.log('Remote description set from offer');
                }
            } catch(e) {
                console.log('Set remote description error:', e);
            }
            
            // Проверяем статус
            if (data.status === 'active' && currentCall && !currentCall.isActive) {
                onCallConnected(callId, currentCall.partnerName);
            }
            
        }, (error) => {
            console.error('Signaling listener error:', error);
        });
        
        callListeners.set(`signaling_${callId}`, unsubscribe);
    }
    
    // Функция подключения
    function onCallConnected(callId, partnerName) {
        if (currentCall && !currentCall.isActive) {
            console.log('Call connected!');
            currentCall.isActive = true;
            updateDoc(doc(db, "calls", callId), { status: 'active' }).catch(() => {});
            showCallModal(partnerName, 'active');
            startCallTimer();
            playSound('call');
        }
    }
    
    // Завершение звонка
    async function endCall() {
        console.log('Ending call');
        stopCallTimer();
        
        // Очищаем слушатели
        callListeners.forEach((unsub, key) => {
            try { unsub(); } catch(e) {}
        });
        callListeners.clear();
        
        // Закрываем PeerConnection
        if (peerConnection) {
            try {
                peerConnection.close();
            } catch(e) {}
            peerConnection = null;
        }
        
        // Останавливаем локальный поток
        if (localStream) {
            try {
                localStream.getTracks().forEach(track => track.stop());
            } catch(e) {}
            localStream = null;
        }
        
        // Очищаем удаленный аудио
        if (remoteAudio) {
            try {
                remoteAudio.srcObject = null;
                remoteAudio.remove();
            } catch(e) {}
            remoteAudio = null;
        }
        
        // Обновляем статус звонка
        if (currentCall && currentCall.callId) {
            try {
                await updateDoc(doc(db, "calls", currentCall.callId), { 
                    status: 'ended',
                    endedAt: new Date()
                }).catch(() => {});
                
                // Удаляем через 5 секунд
                setTimeout(async () => {
                    try {
                        await deleteDoc(doc(db, "calls", currentCall.callId)).catch(() => {});
                    } catch(e) {}
                }, 5000);
            } catch(e) {}
        }
        
        isSpeakerOn = false;
        iceRestartAttempts = 0;
        currentCall = null;
        closeCallModal();
    }
    
    // Показать модалку звонка
    function showCallModal(partnerName, status) {
        const modal = document.getElementById('callModal');
        const callAvatar = document.getElementById('callAvatar');
        const callName = document.getElementById('callName');
        const callStatus = document.getElementById('callStatus');
        const callTimer = document.getElementById('callTimer');
        const callActions = document.getElementById('callActions');
        
        getUserProfile(partnerName).then(profile => {
            callAvatar.style.backgroundImage = profile.avatarBase64 ? `url(${profile.avatarBase64})` : '';
            callAvatar.textContent = profile.avatarBase64 ? '' : profile.displayName.charAt(0).toUpperCase();
            callName.textContent = profile.displayName;
        });
        
        if (status === 'incoming') {
            callStatus.textContent = 'Входящий звонок...';
            callTimer.style.display = 'none';
            callActions.innerHTML = `
                <div class="call-action-wrapper">
                    <button class="call-action-btn accept" id="acceptCallBtn"><i class="fas fa-phone"></i></button>
                    <span class="call-btn-label">Принять</span>
                </div>
                <div class="call-action-wrapper">
                    <button class="call-action-btn decline" id="declineCallBtn"><i class="fas fa-times"></i></button>
                    <span class="call-btn-label">Отклонить</span>
                </div>
            `;
            document.getElementById('acceptCallBtn').onclick = () => acceptCall(currentCall.callId, partnerName);
            document.getElementById('declineCallBtn').onclick = () => endCall();
        } else if (status === 'calling') {
            callStatus.textContent = 'Звоним...';
            callTimer.style.display = 'none';
            callActions.innerHTML = `
                <div class="call-action-wrapper">
                    <button class="call-action-btn end" id="endCallBtn"><i class="fas fa-phone-slash"></i></button>
                    <span class="call-btn-label">Отменить</span>
                </div>
            `;
            document.getElementById('endCallBtn').onclick = () => endCall();
        } else if (status === 'connecting') {
            callStatus.textContent = 'Соединение...';
            callTimer.style.display = 'none';
            callActions.innerHTML = `
                <div class="call-action-wrapper">
                    <button class="call-action-btn end" id="endCallBtn"><i class="fas fa-phone-slash"></i></button>
                    <span class="call-btn-label">Отменить</span>
                </div>
            `;
            document.getElementById('endCallBtn').onclick = () => endCall();
        } else if (status === 'active') {
            let muted = false;
            callStatus.textContent = 'В разговоре';
            if (callStartTime) {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                callTimer.textContent = formatCallTime(elapsed);
                callTimer.style.display = 'block';
            }
            
            callActions.innerHTML = `
                <div class="call-action-wrapper">
                    <button class="call-action-btn mic" id="micToggleBtn"><i class="fas fa-microphone"></i></button>
                    <span class="call-btn-label">Микрофон</span>
                </div>
                <div class="call-action-wrapper">
                    <button class="call-action-btn speaker ${isSpeakerOn ? 'active' : ''}" id="speakerToggleBtn"><i class="fas fa-volume-up"></i></button>
                    <span class="call-btn-label">Динамик</span>
                </div>
                <div class="call-action-wrapper">
                    <button class="call-action-btn end" id="endCallBtn"><i class="fas fa-phone-slash"></i></button>
                    <span class="call-btn-label">Завершить</span>
                </div>
            `;
            
            document.getElementById('micToggleBtn').addEventListener('click', () => {
                if (localStream) {
                    muted = !muted;
                    localStream.getAudioTracks().forEach(track => track.enabled = !muted);
                    const btn = document.getElementById('micToggleBtn');
                    if (muted) {
                        btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                        btn.classList.add('muted');
                        btn.nextElementSibling.textContent = 'Выкл';
                    } else {
                        btn.innerHTML = '<i class="fas fa-microphone"></i>';
                        btn.classList.remove('muted');
                        btn.nextElementSibling.textContent = 'Микрофон';
                    }
                }
            });
            
            document.getElementById('speakerToggleBtn').addEventListener('click', () => {
                isSpeakerOn = !isSpeakerOn;
                setSpeakerMode(isSpeakerOn);
                const btn = document.getElementById('speakerToggleBtn');
                if (isSpeakerOn) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            document.getElementById('endCallBtn').onclick = () => endCall();
        }
        
        modal.classList.add('active');
    }
    
    // Закрыть модалку звонка
    function closeCallModal() {
        const modal = document.getElementById('callModal');
        modal.classList.remove('active');
    }
    
    // Запустить таймер звонка
    function startCallTimer() {
        callStartTime = Date.now();
        const timerEl = document.getElementById('callTimer');
        if (timerEl) {
            timerEl.style.display = 'block';
            timerEl.textContent = '00:00';
        }
        
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            const timerEl = document.getElementById('callTimer');
            if (timerEl) timerEl.textContent = formatCallTime(elapsed);
        }, 1000);
    }
    
    // Остановить таймер звонка
    function stopCallTimer() {
        if (callTimerInterval) {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
        }
        callStartTime = null;
        const timerEl = document.getElementById('callTimer');
        if (timerEl) timerEl.style.display = 'none';
    }
    
    // Установить режим динамика
    function setSpeakerMode(on) {
        if (remoteAudio) {
            if (typeof remoteAudio.setSinkId === 'function') {
                remoteAudio.setSinkId(on ? 'speaker' : 'default').catch(() => {
                    remoteAudio.volume = 1.0;
                });
            } else {
                remoteAudio.volume = 1.0;
            }
        }
        isSpeakerOn = on;
    }
    
    // Форматирование времени звонка
    function formatCallTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    // Слушаем входящие звонки
    function listenForCalls() {
        if (!currentUser) return;
        
        console.log('Listening for incoming calls...');
        const q = query(
            collection(db, "calls"), 
            where("callee", "==", currentUser.username), 
            where("status", "==", "calling")
        );

    // Обработка сетевых событий для восстановления звонков

        window.addEventListener('online', () => {
            if (currentCall && !currentCall.isActive && peerConnection) {

    setupCallErrorHandling();
    
    // ========== ОСТАЛЬНАЯ ЧАСТЬ ПРИЛОЖЕНИЯ ==========
    
    function playSound(type) {
        if (!soundsEnabled) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            gainNode.gain.value = 0.15;
            let duration = 0.3;
            if (type === 'post') { oscillator.frequency.value = 523.25; duration = 0.5; }
            else if (type === 'like') { oscillator.frequency.value = 880; duration = 0.3; }
            else if (type === 'comment') { oscillator.frequency.value = 659.25; duration = 0.4; }
            else if (type === 'subscribe') { oscillator.frequency.value = 392; duration = 0.6; }
            else if (type === 'login') { oscillator.frequency.value = 440; duration = 0.8; }
            else if (type === 'message') { oscillator.frequency.value = 698.46; duration = 0.2; }
            else if (type === 'call') { oscillator.frequency.value = 880; duration = 0.5; setTimeout(() => { if (oscillator) oscillator.frequency.value = 440; }, 250); }
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        } catch(e) { console.log('Audio error:', e); }
    }
    
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function formatDate(date) {
        if (!date) return "только что";
        const diff = Math.floor((new Date() - date) / 60000);
        if (diff < 1) return "только что";
        if (diff < 60) return `${diff} мин назад`;
        if (diff < 1440) return `${Math.floor(diff / 60)} ч назад`;
        return `${Math.floor(diff / 1440)} дн назад`;
    }
    
    function loadSettings() {
        const savedTheme = localStorage.getItem('olegtube_theme');
        const savedSounds = localStorage.getItem('olegtube_sounds');
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-theme');
            document.body.classList.add('dark-theme');
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) themeToggle.classList.add('active');
        } else {
            document.body.classList.remove('dark-theme');
            document.body.classList.add('light-theme');
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) themeToggle.classList.remove('active');
        }
        soundsEnabled = savedSounds !== 'false';
        const soundToggle = document.getElementById('soundToggle');
        if (soundToggle) {
            if (soundsEnabled) soundToggle.classList.add('active');
            else soundToggle.classList.remove('active');
        }
    }
    
    function saveTheme(isDark) {
        if (isDark) {
            localStorage.setItem('olegtube_theme', 'dark');
            document.body.classList.remove('light-theme');
            document.body.classList.add('dark-theme');
        } else {
            localStorage.setItem('olegtube_theme', 'light');
            document.body.classList.remove('dark-theme');
            document.body.classList.add('light-theme');
        }

    function saveSounds(enabled) {
        localStorage.setItem('olegtube_sounds', enabled);
        soundsEnabled = enabled;
    }
    
    async function getUserProfile(username) {
        if (userProfilesCache.has(username)) return userProfilesCache.get(username);
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
            const data = userSnap.data();
            const profile = {
                displayName: data.displayName || username,
                username: username,
                bio: data.bio || "",
                avatarBase64: data.avatarBase64 || null,
                lastUsernameChange: data.lastUsernameChange ? data.lastUsernameChange.toDate() : null,
                isVerified: data.isVerified || false
            };
            userProfilesCache.set(username, profile);
            return profile;
        }
        return { displayName: username, username: username, bio: "", avatarBase64: null };
    }
    
    async function updateUserProfile(displayName, newUsername, bio, avatarBase64 = null) {
        const userRef = doc(db, "users", currentUser.username);
        const userSnap = await getDoc(userRef);
        const userData = userSnap.data();
        const updates = {};
        if (displayName) updates.displayName = displayName;
        if (bio !== undefined) updates.bio = bio;
        if (avatarBase64 !== null) updates.avatarBase64 = avatarBase64;
        if (newUsername && newUsername !== currentUser.username) {
            const lastChange = userData.lastUsernameChange?.toDate() || null;
            const canChange = !lastChange || (new Date() - lastChange) > 30 * 24 * 60 * 60 * 1000;
            if (!canChange) {
                const daysLeft = Math.ceil((30 * 24 * 60 * 60 * 1000 - (new Date() - lastChange)) / (24 * 60 * 60 * 1000));
                throw new Error(`Username можно сменить только раз в месяц. Осталось ${daysLeft} дней`);
            }
            const existingUserRef = doc(db, "users", newUsername);
            const existingSnap = await getDoc(existingUserRef);
            if (existingSnap.exists()) throw new Error("Пользователь с таким username уже существует");
            updates.username = newUsername;
            updates.lastUsernameChange = new Date();
        }
        await updateDoc(userRef, updates);
        if (newUsername && newUsername !== currentUser.username) {
            const oldUsername = currentUser.username;
            currentUser.username = newUsername;
            const postsQuery = query(collection(db, "posts"), where("author", "==", oldUsername));
            const postsSnap = await getDocs(postsQuery);
            for (const postDoc of postsSnap.docs) await updateDoc(postDoc.ref, { author: newUsername });
            const chatsQuery = query(collection(db, "chats"), where("participants", "array-contains", oldUsername));
            const chatsSnap = await getDocs(chatsQuery);
            for (const chatDoc of chatsSnap.docs) {
                const participants = chatDoc.data().participants;
                const newParticipants = participants.map(p => p === oldUsername ? newUsername : p);
                await updateDoc(chatDoc.ref, { participants: newParticipants });
            }
        }
        userProfilesCache.delete(currentUser.username);
        if (newUsername) userProfilesCache.delete(newUsername);
        showToast("Профиль обновлен!");
    }
    
    async function registerUser(username, password) {
        if (!username || !password) throw new Error("Заполните поля");
        if (username.length < 3) throw new Error("Имя минимум 3 символа");
        if (password.length < 4) throw new Error("Пароль минимум 4 символа");
        const userRef = doc(db, "users", username);
        const snap = await getDoc(userRef);
        if (snap.exists()) throw new Error("Пользователь уже существует");
        await setDoc(userRef, {
            username: username, displayName: username, password: password,
            bio: "", createdAt: new Date().toISOString(),
            isVerified: username === "OlegTube" || username === "Admin",
            followers: [], subscriptions: [], isOnline: true, lastSeen: new Date()
        });
        return { username };
    }
    
    async function loginUser(username, password) {
        const userRef = doc(db, "users", username);
        const snap = await getDoc(userRef);
        if (!snap.exists()) throw new Error("Пользователь не найден");
        if (snap.data().password !== password) throw new Error("Неверный пароль");
        await updateDoc(userRef, { isOnline: true, lastSeen: new Date() });
        return { username };
    }
    
    async function getAllPosts() {
        const snapshot = await getDocs(collection(db, "posts"));
        let posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() }));
        posts.sort((a, b) => b.timestamp - a.timestamp);
        return posts;
    }
    
    async function addPost(text, imagesBase64) {
        if ((!text || !text.trim()) && (!imagesBase64 || imagesBase64.length === 0)) throw new Error("Напишите текст или добавьте фото");
        await addDoc(collection(db, "posts"), {
            author: currentUser.username, text: text?.trim() || "",
            timestamp: new Date(), likes: [], likesCount: 0, commentsCount: 0,
            imagesBase64: imagesBase64 || []
        });
        playSound('post');
        showToast('Пост опубликован! 🎉');
    }
    
    async function toggleLike(postId) {
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (!postSnap.exists()) return;
        const data = postSnap.data();
        const hasLiked = data.likes?.includes(currentUser.username);
        if (hasLiked) {
            await updateDoc(postRef, { likes: arrayRemove(currentUser.username), likesCount: Math.max(0, data.likesCount - 1) });
        } else {
            await updateDoc(postRef, { likes: arrayUnion(currentUser.username), likesCount: (data.likesCount || 0) + 1 });
            playSound('like');
        }
    }
    
    async function addComment(postId, text) {
        if (!text.trim()) return;
        await addDoc(collection(db, "posts", postId, "comments"), {
            author: currentUser.username, text: text.trim(), timestamp: new Date()
        });
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (postSnap.exists()) {
            await updateDoc(postRef, { commentsCount: (postSnap.data().commentsCount || 0) + 1 });
        }
        playSound('comment');
    }
    
    async function getComments(postId) {
        const snapshot = await getDocs(query(collection(db, "posts", postId, "comments"), orderBy("timestamp", "asc")));
        return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() }));
    }
    
    async function getUserPosts(username) {
        const snapshot = await getDocs(query(collection(db, "posts"), where("author", "==", username)));
        let posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() }));
        posts.sort((a, b) => b.timestamp - a.timestamp);
        return posts;
    }
    
    async function toggleSubscribe(targetUsername) {
        if (targetUsername === currentUser.username) return;
        const userRef = doc(db, "users", currentUser.username);
        const userSnap = await getDoc(userRef);
        const subs = userSnap.data()?.subscriptions || [];
        const isSub = subs.includes(targetUsername);
        if (isSub) {
            await updateDoc(userRef, { subscriptions: arrayRemove(targetUsername) });
            await updateDoc(doc(db, "users", targetUsername), { followers: arrayRemove(currentUser.username) });
        } else {
            await updateDoc(userRef, { subscriptions: arrayUnion(targetUsername) });
            await updateDoc(doc(db, "users", targetUsername), { followers: arrayUnion(currentUser.username) });
            playSound('subscribe');
        }
        if (viewingProfile === targetUsername) await showProfile(targetUsername);
        if (currentPanel === 'profile' && (!viewingProfile || viewingProfile === currentUser.username)) await showMyProfile();
        await renderFeed();
    }
    
    async function renderComment(comment) {
        const authorProfile = await getUserProfile(comment.author);
        const avatarStyle = authorProfile.avatarBase64 ? `background-image: url(${authorProfile.avatarBase64});` : '';
        return `<div class="comment"><div class="comment-avatar" data-user="${comment.author}" style="${avatarStyle}">${!authorProfile.avatarBase64 ? escapeHtml(comment.author.charAt(0).toUpperCase()) : ''}</div><div class="comment-content"><div class="comment-author" data-user="${comment.author}">${escapeHtml(authorProfile.displayName)}</div><div class="comment-username">@${escapeHtml(comment.author)}</div><div class="comment-text">${escapeHtml(comment.text)}</div><div class="comment-date">${formatDate(comment.timestamp)}</div></div></div>`;

    async function loadCommentsForPost(postId) {
        const comments = await getComments(postId);
        const commentsContainer = document.getElementById(`comments-${postId}`);
        if (!commentsContainer) return;
        if (comments.length === 0) { commentsContainer.innerHTML = '<div style="padding: 8px; opacity: 0.6; font-size: 12px;">Нет комментариев. Будьте первым!</div>'; return; }

    async function renderPost(post) {
        const authorProfile = await getUserProfile(post.author);
        const hasLiked = post.likes?.includes(currentUser.username);
        const showComments = commentsStates.get(post.id) || false;
        const images = post.imagesBase64 || [];

    async function handleSendComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input?.value || '';

        await addComment(postId, text);

    function attachPostHandlers(container) {
        if (!container) return;
        container.querySelectorAll('.post-avatar, .post-author-name').forEach(el => {
            const user = el.dataset.user;
            if (user && user !== currentUser.username) { el.onclick = (e) => { e.stopPropagation(); showProfile(user); setPanel('profile'); }; }
        });
        container.querySelectorAll('.post-image').forEach(el => {
            el.onclick = () => { const viewer = document.createElement('div'); viewer.className = 'image-viewer'; viewer.innerHTML = `<img src="${el.querySelector('img').src}" alt="Просмотр">`; viewer.onclick = () => viewer.remove(); document.body.appendChild(viewer); };
        });
        container.querySelectorAll('.like-btn').forEach(btn => { btn.onclick = async () => { await toggleLike(btn.dataset.id); await loadPosts(); }; });
        container.querySelectorAll('.show-comments-btn').forEach(btn => {
            btn.onclick = async () => {
                const postId = btn.dataset.id;
                const currentState = commentsStates.get(postId) || false;
                commentsStates.set(postId, !currentState);
                const postCard = btn.closest('.post-card');
                if (postCard) {
                    const commentsSection = postCard.querySelector('.comments-section');
                    if (commentsSection) {
                        commentsSection.style.display = !currentState ? 'block' : 'none';
                        if (!currentState) await loadCommentsForPost(postId);
                    }
                }
            };
        });
        container.querySelectorAll('.comment-send-btn').forEach(btn => { btn.onclick = () => handleSendComment(btn.dataset.post); });
    }
    
    async function renderFeed() {

dary" id="messageProfileBtn"><i class="fas fa-envelope"></i> Сообщение</button></div>` : ''}<div class="profile-posts"><h4>Записи</h4><div id="profilePostsList"></div></div></div>`;

    async function changeAvatar() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) { showToast('Файл слишком большой. Максимум 2MB'); return; }
                try {
                    const compressedBlob = await resizeImage(file, 300, 300, 0.8);
                    const base64 = await blobToBase64(compressedBlob);
                    await updateDoc(doc(db, "users", currentUser.username), { avatarBase64: base64 });
                    userProfilesCache.delete(currentUser.username);
                    showToast("Аватар обновлен!");
                    await showMyProfile();
                    await loadPosts();
                } catch(err) { showToast("Ошибка загрузки аватара"); }
            }
        };
        input.click();
    }
    
    function resizeImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    if (height > maxHeight) { width = (width * maxHeight) / height; height = maxHeight; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), file.type, quality);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }
    
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
        });
    }
    
    function openEditProfileModal() {
        const modal = document.getElementById('editProfileModal');
        const displayNameInput = document.getElementById('editDisplayName');
        const usernameInput = document.getElementById('editUsername');
        const bioInput = document.getElementById('editBio');
        const warningDiv = document.getElementById('usernameWarning');
        const lastChangeInfo = document.getElementById('lastChangeInfo');
        getUserProfile(currentUser.username).then(async profile => {
            displayNameInput.value = profile.displayName;
            usernameInput.value = profile.username;
            bioInput.value = profile.bio || '';
            const userRef = doc(db, "users", currentUser.username);
            const userSnap = await getDoc(userRef);
            const lastChange = userSnap.data()?.lastUsernameChange?.toDate();
            if (lastChange) {
                const daysLeft = Math.ceil((30 * 24 * 60 * 60 * 1000 - (new Date() - lastChange)) / (24 * 60 * 60 * 1000));
                if (daysLeft > 0) { lastChangeInfo.textContent = `Username можно будет сменить через ${daysLeft} дней`; lastChangeInfo.style.color = '#e64646'; }
                else { lastChangeInfo.textContent = 'Username можно сменить'; lastChangeInfo.style.color = '#4bb34b'; }
            } else { lastChangeInfo.textContent = 'Username можно сменить (раз в месяц)'; lastChangeInfo.style.color = '#939393'; }
        });
        modal.classList.add('active');
        const saveBtn = document.getElementById('saveProfileBtn');
        const cancelBtn = document.getElementById('cancelEditBtn');
        const saveHandler = async () => {
            const newDisplayName = displayNameInput.value.trim() || currentUser.username;
            const newUsername = usernameInput.value.trim();
            const newBio = bioInput.value.trim();
            if (newUsername && newUsername !== currentUser.username) {
                if (!/^[a-zA-Z0-9_]+$/.test(newUsername)) { warningDiv.textContent = "Username может содержать только буквы, цифры и underscore"; return; }
                if (newUsername.length < 3) { warningDiv.textContent = "Username должен быть не менее 3 символов"; return; }
            }
            try {
                await updateUserProfile(newDisplayName, newUsername, newBio);
                modal.classList.remove('active');
                warningDiv.textContent = '';
                await showMyProfile();
                await loadPosts();
                await loadChats();
                showToast("Профиль успешно обновлен!");
            } catch(err) { warningDiv.textContent = err.message; }
        };
        const cancelHandler = () => { modal.classList.remove('active'); warningDiv.textContent = ''; };
        saveBtn.onclick = saveHandler;
        cancelBtn.onclick = cancelHandler;
    }

        if (!snap.exists()) { await setDoc(chatRef, { participants: [currentUser.username, otherUsername], lastMessage: "", lastMessageTime: new Date() }); }
