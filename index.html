    function openChat(chatId, partnerName) {
        if (unsubscribeCurrentChat) {
            unsubscribeCurrentChat();
            unsubscribeCurrentChat = null;
        }
        
        document.getElementById('chatsListView').style.display = 'none';
        document.getElementById('newChatUsers').style.display = 'none';
        const chatView = document.getElementById('chatView');
        chatView.style.display = 'block';
        
        chatView.innerHTML = `
            <div class="chat-container">
                <div class="chat-header">
                    <button class="back-btn" id="closeChatBtn"><i class="fas fa-arrow-left"></i></button>
                    <div class="chat-user-info">
                        <div class="chat-user-name" id="chatPartnerName"></div>
                        <div class="chat-user-username" id="chatPartnerUsername"></div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="call-btn" id="callInChatBtn"><i class="fas fa-phone"></i></button>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatMessageInput" placeholder="Сообщение...">
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        `;
        
        getUserProfile(partnerName).then(profile => {
            document.getElementById('chatPartnerName').textContent = profile.displayName;
            document.getElementById('chatPartnerUsername').textContent = `@${partnerName}`;
        });
        
        const messagesDiv = document.getElementById('chatMessages');
        const input = document.getElementById('chatMessageInput');
        const sendBtn = document.getElementById('sendChatBtn');
        const callBtn = document.getElementById('callInChatBtn');
        
        callBtn.onclick = () => startCall(partnerName);
        
        const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
        unsubscribeCurrentChat = onSnapshot(q, async (snap) => {
            const messages = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const messageHtmls = await Promise.all(messages.map(async m => {
                const isMe = m.senderId === currentUser.username;
                const senderProfile = await getUserProfile(m.senderId);
                const time = m.timestamp?.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) || '';
                return `<div class="chat-message ${isMe ? 'out' : 'in'}"><div><strong>${escapeHtml(senderProfile.displayName)}</strong>: ${escapeHtml(m.text)}</div><div style="font-size:10px; opacity:0.7; margin-top:4px;">${time}</div></div>`;
            }));
            messagesDiv.innerHTML = messageHtmls.join('');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        
        const sendMessageHandler = async () => {
            const text = input.value;
            if (!text.trim()) return;
            await sendMessage(chatId, text);
            input.value = '';
        };
        
        sendBtn.onclick = sendMessageHandler;
        input.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessageHandler();
        };
        
        document.getElementById('closeChatBtn').onclick = () => {
            closeChat();
        };
    }
    
    function closeChat() {
        if (unsubscribeCurrentChat) {
            unsubscribeCurrentChat();
            unsubscribeCurrentChat = null;
        }
        document.getElementById('chatsListView').style.display = 'block';
        document.getElementById('chatView').style.display = 'none';
        loadChats();
    }
    
    async function loadChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        if (unsubscribeChats) unsubscribeChats();
        const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.username));
        unsubscribeChats = onSnapshot(q, async (snap) => {
            const chats = [];
            for (const docSnap of snap.docs) {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const other = chat.participants.find(p => p !== currentUser.username);
                chat.otherUser = other;
                const profile = await getUserProfile(other);
                chat.profile = profile;
                chats.push(chat);
            }
            chats.sort((a,b) => (b.lastMessageTime?.toDate() || 0) - (a.lastMessageTime?.toDate() || 0));
            if (chats.length === 0) { container.innerHTML = '<div class="loading">Нет диалогов</div>'; return; }
            container.innerHTML = chats.map(chat => `<div class="chat-item" data-chat="${chat.id}" data-user="${chat.otherUser}"><div class="chat-avatar" style="background-image: url(${chat.profile.avatarBase64 || ''}); background-size: cover;">${!chat.profile.avatarBase64 ? escapeHtml(chat.otherUser?.charAt(0).toUpperCase() || '?') : ''}</div><div class="chat-info"><div class="chat-name">${escapeHtml(chat.profile.displayName)} <span class="chat-username">@${escapeHtml(chat.otherUser)}</span></div><div class="chat-last-msg">${escapeHtml(chat.lastMessage?.substring(0, 50) || 'Новый диалог')}</div></div></div>`).join('');
            document.querySelectorAll('.chat-item').forEach(el => { el.onclick = () => openChat(el.dataset.chat, el.dataset.user); });
        });
    }
    
    async function searchUsers(searchTerm) {
        if (!searchTerm.trim()) return [];
        const usersRef = collection(db, "users");
        const snapshot = await getDocs(usersRef);
        const results = [];
        const term = searchTerm.toLowerCase();
        for (const docSnap of snapshot.docs) {
            const data = docSnap.data();
            const username = docSnap.id;
            const displayName = data.displayName || username;
            if (term.startsWith('@')) { const searchUsername = term.substring(1); if (username.toLowerCase().includes(searchUsername)) results.push({ username, displayName, avatarBase64: data.avatarBase64 }); }
            else { if (displayName.toLowerCase().includes(term) || username.toLowerCase().includes(term)) results.push({ username, displayName, avatarBase64: data.avatarBase64 }); }
        }
        return results.slice(0, 20);
    }
    
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('searchResults');
        let debounceTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(async () => {
                const term = searchInput.value;
                if (!term.trim()) { resultsDiv.innerHTML = ''; return; }
                resultsDiv.innerHTML = '<div class="loading">Поиск...</div>';
                const results = await searchUsers(term);
                if (results.length === 0) { resultsDiv.innerHTML = '<div class="loading">Ничего не найдено</div>'; }
                else { resultsDiv.innerHTML = results.map(r => `<div class="search-result-item" data-user="${r.username}"><div class="search-result-avatar" style="background-image: url(${r.avatarBase64 || ''}); background-size: cover;">${!r.avatarBase64 ? escapeHtml(r.username.charAt(0).toUpperCase()) : ''}</div><div class="search-result-info"><div class="search-result-name">${escapeHtml(r.displayName)}</div><div class="search-result-username">@${escapeHtml(r.username)}</div></div></div>`).join('');
                    resultsDiv.querySelectorAll('.search-result-item').forEach(el => { el.onclick = () => { showProfile(el.dataset.user); setPanel('profile'); }; }); }
            }, 300);
        });
    }
    
    function setPanel(panel) {
        if (currentPanel === 'messages' && panel !== 'messages') {
            closeChat();
        }
        
        const panels = ['feedPanel', 'searchPanel', 'messagesPanel', 'profilePanel', 'settingsPanel'];
        panels.forEach(p => document.getElementById(p)?.classList.add('hide'));
        if (panel === 'home') document.getElementById('feedPanel')?.classList.remove('hide');
        else if (panel === 'search') document.getElementById('searchPanel')?.classList.remove('hide');
        else if (panel === 'messages') {
            document.getElementById('messagesPanel')?.classList.remove('hide');
            document.getElementById('chatsListView').style.display = 'block';
            document.getElementById('newChatUsers').style.display = 'none';
            document.getElementById('chatView').style.display = 'none';
            if (unsubscribeCurrentChat) {
                unsubscribeCurrentChat();
                unsubscribeCurrentChat = null;
            }
            loadChats();
        }
        else if (panel === 'profile') document.getElementById('profilePanel')?.classList.remove('hide');
        else if (panel === 'settings') document.getElementById('settingsPanel')?.classList.remove('hide');
        currentPanel = panel;
        if (panel === 'home') renderFeed();
        if (panel === 'profile') { if (viewingProfile && viewingProfile !== currentUser.username) showProfile(viewingProfile); else showMyProfile(); }
        const menuMap = { home: 'menuHome', search: 'menuSearch', messages: 'menuMessages', profile: 'menuProfile' };
        ['menuHome', 'menuSearch', 'menuMessages', 'menuProfile'].forEach(id => { document.getElementById(id)?.classList.remove('active'); });
        if (menuMap[panel]) document.getElementById(menuMap[panel])?.classList.add('active');
    }
    
    function updateImagePreviews() {
        const container = document.getElementById('imagesPreviewContainer');
        if (currentImageFiles.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = currentImageFiles.map((file, i) => `<div class="image-preview-item" data-index="${i}"><img src="${URL.createObjectURL(file)}" alt="Preview"><button class="remove-image-btn" data-index="${i}"><i class="fas fa-times"></i></button></div>`).join('');
        document.querySelectorAll('.remove-image-btn').forEach(btn => { btn.onclick = () => { currentImageFiles.splice(parseInt(btn.dataset.index), 1); updateImagePreviews(); }; });
    }
    
    // ========== ОБРАБОТЧИКИ СОБЫТИЙ ==========
    
    document.getElementById('uploadImageBtn')?.addEventListener('click', () => document.getElementById('imageInput').click());
    document.getElementById('imageInput')?.addEventListener('change', (e) => { const files = Array.from(e.target.files); currentImageFiles.push(...files.slice(0, 3 - currentImageFiles.length)); updateImagePreviews(); document.getElementById('imageInput').value = ''; });
    document.getElementById('logoHome')?.addEventListener('click', () => setPanel('home'));
    document.getElementById('menuHome')?.addEventListener('click', () => setPanel('home'));
    document.getElementById('menuSearch')?.addEventListener('click', () => setPanel('search'));
    document.getElementById('menuMessages')?.addEventListener('click', () => setPanel('messages'));
    document.getElementById('menuProfile')?.addEventListener('click', () => { viewingProfile = null; setPanel('profile'); });
    document.getElementById('menuCreatePost')?.addEventListener('click', () => document.getElementById('createPostModal').classList.add('active'));
    document.getElementById('settingsBtn')?.addEventListener('click', () => setPanel('settings'));
    
    document.getElementById('themeToggle')?.addEventListener('click', () => { const isDark = document.body.classList.contains('dark-theme'); if (isDark) { saveTheme(false); document.getElementById('themeToggle').classList.remove('active'); } else { saveTheme(true); document.getElementById('themeToggle').classList.add('active'); } });
    document.getElementById('soundToggle')?.addEventListener('click', () => { soundsEnabled = !soundsEnabled; saveSounds(soundsEnabled); const soundToggle = document.getElementById('soundToggle'); if (soundsEnabled) { soundToggle.classList.add('active'); playSound('login'); } else { soundToggle.classList.remove('active'); } });
    document.getElementById('editProfileSettingsBtn')?.addEventListener('click', () => { openEditProfileModal(); });
    
    document.getElementById('submitPostBtn')?.addEventListener('click', async () => {
        const text = document.getElementById('postText')?.value;
        if ((!text || !text.trim()) && currentImageFiles.length === 0) { alert('Напишите что-нибудь или добавьте фото'); return; }
        try {
            let imagesBase64 = [];
            if (currentImageFiles.length > 0) { for (const file of currentImageFiles) { const compressed = await resizeImage(file, 800, 800, 0.7); const base64 = await blobToBase64(compressed); imagesBase64.push(base64); } }
            await addPost(text, imagesBase64);
            document.getElementById('createPostModal').classList.remove('active');
            document.getElementById('postText').value = '';
            currentImageFiles = [];
            updateImagePreviews();
            await loadPosts();
            if (currentPanel === 'profile') await showMyProfile();
        } catch(error) { alert('Ошибка: ' + error.message); }
    });
    
    document.getElementById('cancelPostBtn')?.addEventListener('click', () => {
        document.getElementById('createPostModal').classList.remove('active');
        document.getElementById('postText').value = '';
        currentImageFiles = [];
        updateImagePreviews();
    });
    
    document.getElementById('newChatBtn')?.addEventListener('click', async () => {
        const chatsListView = document.getElementById('chatsListView');
        const newChatUsers = document.getElementById('newChatUsers');
        chatsListView.style.display = 'none';
        newChatUsers.style.display = 'block';
        const userSnap = await getDoc(doc(db, "users", currentUser.username));
        const userData = userSnap.data();
        const followers = userData.followers || [];
        const subscriptions = userData.subscriptions || [];
        const friendsSet = new Set();
        followers.forEach(f => { if (subscriptions.includes(f)) friendsSet.add(f); });
        const friendsList = Array.from(friendsSet);
        const container = document.getElementById('usersList');
        if (friendsList.length === 0) { container.innerHTML = '<div class="loading">У вас пока нет друзей</div>'; return; }
        const friendProfiles = await Promise.all(friendsList.map(async u => { const profile = await getUserProfile(u); return { username: u, ...profile }; }));
        const render = (list) => {
            container.innerHTML = list.map(u => `<div class="chat-item" data-user="${u.username}"><div class="chat-avatar" style="background-image: url(${u.avatarBase64 || ''}); background-size: cover;">${!u.avatarBase64 ? escapeHtml(u.username.charAt(0).toUpperCase()) : ''}</div><div><strong>${escapeHtml(u.displayName)}</strong><br><span style="font-size:11px; opacity:0.6;">@${escapeHtml(u.username)}</span><span class="friend-badge">друг</span></div></div>`).join('');
            document.querySelectorAll('#usersList .chat-item').forEach(el => { el.onclick = async () => { const target = el.dataset.user; const chatId = await getOrCreateChatId(target); openChat(chatId, target); }; });
        };
        render(friendProfiles);
        document.getElementById('searchUserInput').oninput = (e) => { const term = e.target.value.toLowerCase(); render(friendProfiles.filter(u => u.displayName.toLowerCase().includes(term) || u.username.toLowerCase().includes(term))); };
    });
    
    document.getElementById('backToChatsBtn')?.addEventListener('click', () => { 
        document.getElementById('chatsListView').style.display = 'block'; 
        document.getElementById('newChatUsers').style.display = 'none'; 
        loadChats(); 
    });
    
    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        if (currentUser) await updateDoc(doc(db, "users", currentUser.username), { isOnline: false, lastSeen: new Date() }).catch(() => {});
        if (unsubscribePosts) unsubscribePosts();
        if (unsubscribeChats) unsubscribeChats();
        if (unsubscribeCurrentChat) unsubscribeCurrentChat();
        stopCallTimer();
        callListeners.forEach(unsub => unsub());
        callListeners.clear();
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (remoteAudio) {
            remoteAudio.srcObject = null;
            remoteAudio.remove();
            remoteAudio = null;
        }
        document.getElementById('appScreen').style.display = 'none';
        document.getElementById('authScreen').style.display = 'block';
        currentUser = null;
    });
    
    const loginBtn = document.getElementById('loginBtn');
    const showRegisterBtn = document.getElementById('showRegisterBtn');
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');
    let isLoginMode = true;
    
    showRegisterBtn.onclick = () => {
        isLoginMode = !isLoginMode;
        loginBtn.innerText = isLoginMode ? "Войти" : "Зарегистрироваться";
        showRegisterBtn.innerText = isLoginMode ? "Зарегистрироваться" : "Назад к входу";
        authError.innerText = "";
        authSuccess.innerText = "";
    };
    
    async function handleAuth() {
        const username = document.getElementById('loginName')?.value.trim();
        const password = document.getElementById('loginPassword')?.value.trim();
        if (!username || !password) { authError.innerText = "Заполните все поля"; return; }
        try {
            if (isLoginMode) {
                await loginUser(username, password);
                playSound('login');
                showToast(`Добро пожаловать, ${username}! 🎉`);
            } else {
                await registerUser(username, password);
                authSuccess.innerText = "Регистрация успешна! Теперь войдите.";
                return;
            }
            currentUser = { username };
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            loadSettings();
            await loadPosts();
            setupSearch();
            listenForCalls();
            const q = query(collection(db, "posts"));
            unsubscribePosts = onSnapshot(q, () => loadPosts());
            setPanel('home');
        } catch(err) { authError.innerText = err.message; }
    }
    
    loginBtn.onclick = handleAuth;
    document.getElementById('loginPassword')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); });
    
    let commentsStates = new Map();
    
    async function initTestPost() {
        const q = query(collection(db, "posts"));
        const snap = await getDocs(q);
        if (snap.empty) {
            await addDoc(collection(db, "posts"), {
                author: "OlegTube", 
                text: "Добро пожаловать в OlegTube! 🎉\n\nВозможности:\n✓ Голосовые звонки в чатах!\n✓ Настройки (тёмная/светлая тема, звуки)\n✓ Редактор профиля\n✓ Поиск по имени и @username\n✓ Отправка фото в постах\n✓ Лайки и комментарии\n\nНаслаждайтесь общением!",
                timestamp: new Date(), 
                likes: [], 
                likesCount: 0, 
                commentsCount: 0,
                imagesBase64: []
            });
        }
    }
    initTestPost();
</script>
</body>
</html>
