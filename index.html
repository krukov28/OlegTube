<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OlegTube — Социальная сеть</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #edeef0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .auth-container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 8px;
            padding: 40px 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin: 20px;
        }
        .auth-container h2 { 
            text-align: center; 
            color: #2a5885; 
            margin-bottom: 32px;
            font-size: 28px;
        }
        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #d3d9de;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        .auth-input:focus { outline: none; border-color: #2a5885; }
        .auth-btn {
            width: 100%;
            padding: 10px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .auth-btn:hover { background: #1e3e5f; }
        .switch-btn { background: none; color: #2a5885; border: 1px solid #2a5885; }
        .switch-btn:hover { background: #e5ebf1; }
        .error-msg { color: #e64646; text-align: center; margin-bottom: 12px; font-size: 13px; }
        .success-msg { color: #4bb34b; text-align: center; margin-bottom: 12px; font-size: 13px; }
        
        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #edeef0;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2a5885;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            color: white;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .notifications-bell {
            position: relative;
            cursor: pointer;
            color: white;
            font-size: 20px;
        }
        .notifications-bell .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e64646;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        .logout-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.25); }
        
        .main-layout {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 16px;
            gap: 16px;
            position: relative;
            align-items: flex-start;
        }
        
        .left-menu {
            width: 200px;
            flex-shrink: 0;
            position: sticky;
            top: 60px;
            align-self: flex-start;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: white;
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #2c3e50;
            transition: all 0.2s;
        }
        .menu-item i { width: 20px; color: #2a5885; }
        .menu-item:hover { background: #e5ebf1; }
        .menu-item.active { background: #e5ebf1; font-weight: 500; }
        
        .content-panel {
            flex: 1;
            min-width: 0;
        }
        
        .post-card {
            background: white;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            transition: background 0.3s;
        }
        .post-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .post-author-info { flex: 1; }
        .post-author-name {
            font-weight: 600;
            color: #2a5885;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .post-author-username {
            font-size: 11px;
            color: #939393;
            margin-top: 2px;
        }
        .post-author-name:hover { text-decoration: underline; }
        .post-date {
            font-size: 12px;
            color: #939393;
            margin-top: 2px;
        }
        .post-text {
            font-size: 14px;
            line-height: 1.4;
            color: #2c3e50;
            margin-bottom: 12px;
            word-break: break-word;
        }
        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .post-image {
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #f5f5f5;
            min-height: 120px;
        }
        .post-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: transform 0.2s;
        }
        .post-image img:hover {
            transform: scale(1.02);
        }
        .post-images:has(.post-image:only-child) .post-image img {
            max-height: 350px;
            height: auto;
        }
        .post-actions {
            display: flex;
            gap: 24px;
            padding-top: 8px;
            border-top: 1px solid #edeef0;
        }
        .post-action {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6c7a8e;
            cursor: pointer;
        }
        .post-action:hover { color: #2a5885; }
        .post-action.liked { color: #e64646; }
        
        .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #edeef0;
        }
        .comment {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .comment-avatar {
            width: 32px;
            height: 32px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .comment-content {
            flex: 1;
        }
        .comment-author {
            font-weight: 600;
            font-size: 12px;
            color: #2a5885;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .comment-username {
            font-size: 10px;
            color: #939393;
        }
        .comment-text {
            font-size: 12px;
            color: #2c3e50;
            margin-top: 2px;
            word-break: break-word;
        }
        .comment-image {
            margin-top: 6px;
            max-width: 200px;
            border-radius: 8px;
            cursor: pointer;
        }
        .comment-image img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .comment-date {
            font-size: 10px;
            color: #939393;
            margin-top: 4px;
        }
        .add-comment {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .add-comment-input-group {
            display: flex;
            flex: 1;
            gap: 8px;
        }
        .add-comment input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d3d9de;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
        }
        .comment-attach-btn {
            background: #e5ebf1;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            color: #2a5885;
            font-size: 12px;
        }
        .add-comment button {
            padding: 6px 12px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .comment-image-preview {
            margin-top: 6px;
            position: relative;
            display: inline-block;
        }
        .comment-image-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .remove-comment-image {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e64646;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .show-comments-btn {
            font-size: 12px;
            color: #6c7a8e;
            cursor: pointer;
        }
        .show-comments-btn:hover {
            color: #2a5885;
        }
        
        .profile-card {
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }
        .profile-cover {
            height: 120px;
            background: linear-gradient(135deg, #2a5885, #1e3e5f);
            position: relative;
        }
        .profile-cover-edit {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .profile-info {
            padding: 16px;
            text-align: center;
            margin-top: -40px;
            position: relative;
            z-index: 1;
        }
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            background: #2a5885;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: bold;
            color: white;
            border: 4px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
        }
        .avatar-edit-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #2a5885;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
            cursor: pointer;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .profile-username {
            font-size: 14px;
            color: #939393;
            margin-bottom: 8px;
        }
        .profile-bio {
            font-size: 13px;
            color: #2c3e50;
            margin: 8px 0;
            padding: 0 16px;
        }
        .profile-status {
            font-size:12px; 
            color:#939393; 
            margin-top:4px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 16px;
            border-top: 1px solid #edeef0;
            border-bottom: 1px solid #edeef0;
            margin: 16px 0;
        }
        .profile-stat { text-align: center; }
        .profile-stat-number {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        .profile-stat-label {
            font-size: 12px;
            color: #939393;
        }
        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 0 16px 16px;
            flex-wrap: wrap;
        }
        .profile-btn {
            padding: 8px 24px;
            background: #2a5885;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .profile-btn:hover { opacity: 0.9; }
        .profile-btn.secondary {
            background: #e5ebf1;
            color: #2a5885;
        }
        .profile-btn.subscribed {
            background: #6c7a8e;
            color: white;
        }
        .profile-back-btn {
            background: none;
            color: #2a5885;
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 0;
            display: inline-block;
            width: auto;
        }
        .profile-back-btn:hover {
            background: #e5ebf1;
            opacity: 1;
        }
        .profile-posts {
            padding: 16px;
        }
        .profile-posts h4 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        
        .edit-profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .edit-profile-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .edit-profile-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .edit-profile-card h3 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .edit-profile-card input,
        .edit-profile-card textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #d3d9de;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .edit-profile-card textarea {
            resize: vertical;
            min-height: 80px;
        }
        .username-warning {
            font-size: 11px;
            color: #e64646;
            margin-top: -12px;
            margin-bottom: 12px;
        }
        .last-change-info {
            font-size: 11px;
            color: #939393;
            margin-top: -12px;
            margin-bottom: 12px;
        }
        .edit-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .edit-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .edit-actions .save-btn {
            background: #2a5885;
            color: white;
        }
        .edit-actions .cancel-btn {
            background: #e5ebf1;
            color: #2c3e50;
        }
        
        .chat-list {
            background: white;
            border-radius: 4px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #edeef0;
            cursor: pointer;
        }
        .chat-item:hover { background: #f5f6f7; }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #4bb34b;
            border-radius: 50%;
            border: 2px solid white;
        }
        .chat-info { flex: 1; }
        .chat-name { 
            font-weight: 600; 
            color: #2c3e50; 
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chat-username {
            font-size: 11px;
            color: #939393;
            font-weight: normal;
        }
        .chat-last-msg { font-size: 12px; color: #939393; }
        .chat-status {
            font-size: 11px;
            color: #939393;
            margin-top: 2px;
        }
        
        .notifications-list {
            background: white;
            border-radius: 4px;
        }
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #edeef0;
            cursor: pointer;
        }
        .notification-item:hover { background: #f5f6f7; }
        .notification-item.unread {
            background: #e8f0fe;
        }
        .notification-avatar {
            width: 40px;
            height: 40px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .notification-content {
            flex: 1;
        }
        .notification-text {
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .notification-time {
            font-size: 11px;
            color: #939393;
        }
        .notification-icon {
            font-size: 18px;
            width: 30px;
            text-align: center;
        }
        
        .new-chat-btn {
            background: #2a5885;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d9de;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .search-result-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .search-result-item:hover {
            background: #e5ebf1;
        }
        .search-result-avatar {
            width: 48px;
            height: 48px;
            background: #2a5885;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            background-size: cover;
            background-position: center;
        }
        .search-result-info {
            flex: 1;
        }
        .search-result-name {
            font-weight: 600;
            color: #2c3e50;
        }
        .search-result-username {
            font-size: 12px;
            color: #939393;
        }
        
        .hide { display: none; }
        .loading { text-align: center; padding: 40px; color: #939393; }
        
        .chat-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .chat-fullscreen-header {
            background: #2a5885;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .chat-fullscreen-header .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-fullscreen-header .chat-user-info {
            flex: 1;
        }
        .chat-fullscreen-header .chat-user-name {
            font-size: 18px;
            font-weight: 600;
        }
        .chat-fullscreen-header .chat-user-username {
            font-size: 12px;
            opacity: 0.8;
        }
        .chat-messages-full {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #edeef0;
        }
        .chat-input-full {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #edeef0;
            flex-wrap: wrap;
        }
        .chat-input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }
        .chat-input-full input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d3d9de;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-full button {
            background: #2a5885;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .chat-attach-btn {
            background: #e5ebf1;
            color: #2a5885;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 18px;
        }
        .chat-message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
        }
        .chat-message.out {
            background: #2a5885;
            color: white;
            align-self: flex-end;
        }
        .chat-message.in {
            background: white;
            color: #2c3e50;
            align-self: flex-start;
        }
        .chat-message-image {
            max-width: 200px;
            border-radius: 12px;
            margin-top: 6px;
            cursor: pointer;
        }
        .chat-message-image img {
            width: 100%;

<script type="module">
    import { initializeApp } from "firebase/app";
    import { 
        getFirestore, collection, addDoc, getDocs, getDoc,
        query, where, doc, updateDoc, 
        arrayUnion, arrayRemove, setDoc, onSnapshot, limit, orderBy
    } from "firebase/firestore";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDuJfaJAvigdDsCkeLoHpM3QG30YANa5tU",
        authDomain: "olegtub-69d16.firebaseapp.com",

        appId: "1:899139233363:web:d18229151ec65c5cd4c8a6"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let currentUser = null;
    let currentPanel = 'home';
    let viewingProfile = null;
    let allPosts = [];
    let unsubscribePosts = null;
    let unsubscribeChats = null;
    let unsubscribeNotifications = null;
    let typingListeners = new Map();
    let userStatusListeners = new Map();
    let userStatuses = new Map();
    let currentImageFiles = [];
