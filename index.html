    let unreadCount = 0;
    let pendingCommentImages = new Map();
    
    // User profile cache
    let userProfilesCache = new Map();
    
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            gainNode.gain.value = 0.15;
            let duration = 0.3;
            if (type === 'post') { oscillator.frequency.value = 523.25; duration = 0.5; }
            else if (type === 'like') { oscillator.frequency.value = 880; duration = 0.3; }
            else if (type === 'comment') { oscillator.frequency.value = 659.25; duration = 0.4; }
            else if (type === 'subscribe') { oscillator.frequency.value = 392; duration = 0.6; }
            else if (type === 'login') { oscillator.frequency.value = 440; duration = 0.8; }
            else if (type === 'message') { oscillator.frequency.value = 698.46; duration = 0.2; }
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        } catch(e) { console.log('Audio error:', e); }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function formatDate(date) {
        if (!date) return "только что";
        const diff = Math.floor((new Date() - date) / 60000);
        if (diff < 1) return "только что";
        if (diff < 60) return `${diff} мин назад`;
        if (diff < 1440) return `${Math.floor(diff / 60)} ч назад`;
        return `${Math.floor(diff / 1440)} дн назад`;
    }
    
    function formatLastSeen(timestamp) {
        if (!timestamp) return "был(а) давно";
        const lastSeen = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const now = new Date();
        const diff = Math.floor((now - lastSeen) / 60000);
        if (diff < 1) return "онлайн";
        if (diff < 60) return `был(а) ${diff} мин назад`;
        if (diff < 1440) return `был(а) ${Math.floor(diff / 60)} ч назад`;
        return `был(а) ${lastSeen.toLocaleDateString()}`;
    }
    
    async function getUserProfile(username) {
        if (userProfilesCache.has(username)) {
            return userProfilesCache.get(username);
        }
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
            const data = userSnap.data();
            const profile = {
                displayName: data.displayName || username,
                username: username,
                bio: data.bio || "",
                avatarBase64: data.avatarBase64 || null,
                lastUsernameChange: data.lastUsernameChange ? data.lastUsernameChange.toDate() : null,
                isVerified: data.isVerified || false
            };
            userProfilesCache.set(username, profile);
            return profile;
        }
        return { displayName: username, username: username, bio: "", avatarBase64: null };
    }
    
    async function updateUserProfile(displayName, newUsername, bio, avatarBase64 = null) {
        const userRef = doc(db, "users", currentUser.username);
        const userSnap = await getDoc(userRef);
        const userData = userSnap.data();
        
        const updates = {};
        if (displayName) updates.displayName = displayName;
        if (bio !== undefined) updates.bio = bio;
        if (avatarBase64 !== null) updates.avatarBase64 = avatarBase64;
        
        if (newUsername && newUsername !== currentUser.username) {
            const lastChange = userData.lastUsernameChange?.toDate() || null;
            const canChange = !lastChange || (new Date() - lastChange) > 30 * 24 * 60 * 60 * 1000;
            
            if (!canChange) {
                const daysLeft = Math.ceil((30 * 24 * 60 * 60 * 1000 - (new Date() - lastChange)) / (24 * 60 * 60 * 1000));
                throw new Error(`Username можно сменить только раз в месяц. Осталось ${daysLeft} дней`);
            }
            
            const existingUserRef = doc(db, "users", newUsername);
            const existingSnap = await getDoc(existingUserRef);
            if (existingSnap.exists()) {
                throw new Error("Пользователь с таким username уже существует");
            }
            
            updates.username = newUsername;
            updates.lastUsernameChange = new Date();
        }
        
        await updateDoc(userRef, updates);
        
        if (newUsername && newUsername !== currentUser.username) {
            const oldUsername = currentUser.username;
            currentUser.username = newUsername;
            
            const postsQuery = query(collection(db, "posts"), where("author", "==", oldUsername));
            const postsSnap = await getDocs(postsQuery);
            for (const postDoc of postsSnap.docs) {
                await updateDoc(postDoc.ref, { author: newUsername });
            }
            
            const commentsQuery = query(collection(db, "comments"), where("author", "==", oldUsername));
            const commentsSnap = await getDocs(commentsQuery);
            for (const commentDoc of commentsSnap.docs) {
                await updateDoc(commentDoc.ref, { author: newUsername });
            }
            
            const chatsQuery = query(collection(db, "chats"), where("participants", "array-contains", oldUsername));
            const chatsSnap = await getDocs(chatsQuery);
            for (const chatDoc of chatsSnap.docs) {
                const participants = chatDoc.data().participants;
                const newParticipants = participants.map(p => p === oldUsername ? newUsername : p);
                await updateDoc(chatDoc.ref, { participants: newParticipants });
            }
            
            const notifQuery = query(collection(db, "notifications"), where("fromUser", "==", oldUsername));
            const notifSnap = await getDocs(notifQuery);
            for (const notifDoc of notifSnap.docs) {
                await updateDoc(notifDoc.ref, { fromUser: newUsername });
            }
        }
        
        userProfilesCache.delete(currentUser.username);
        if (newUsername) userProfilesCache.delete(newUsername);
        showToast("Профиль обновлен!");
    }
    
    async function isUserVerified(username) {
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);
        return userSnap.data()?.isVerified || false;
    }
    
    async function addNotification(userTo, type, fromUser, postId = null, commentText = null) {
        if (!fromUser || userTo === fromUser) return;
        try {
            await addDoc(collection(db, "notifications"), {
                toUser: userTo, fromUser: fromUser, type: type,
                postId: postId || null, commentText: commentText || null,
                timestamp: new Date(), read: false
            });
        } catch(e) { console.error('Notification error:', e); }
    }
    
    async function loadNotifications() {
        if (!currentUser) return;
        const q = query(collection(db, "notifications"), where("toUser", "==", currentUser.username), orderBy("timestamp", "desc"));
        unsubscribeNotifications = onSnapshot(q, (snap) => {
            notifications = [];
            snap.forEach(doc => {
                notifications.push({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() });
            });
            unreadCount = notifications.filter(n => !n.read).length;
            updateNotificationBadge();
            if (currentPanel === 'notifications') renderNotifications();
        });
    }
    
    function updateNotificationBadge() {
        const badge = document.getElementById('notificationsBadge');
        if (unreadCount > 0) {
            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }
    
    async function markAllNotificationsAsRead() {
        for (const n of notifications.filter(n => !n.read)) {
            await updateDoc(doc(db, "notifications", n.id), { read: true });
        }
    }
    
    function renderNotifications() {
        const container = document.getElementById('notificationsList');
        if (!container) return;
        if (notifications.length === 0) {
            container.innerHTML = '<div class="loading">Нет уведомлений</div>';
            return;
        }
        container.innerHTML = notifications.map(notif => {
            let icon = '', text = '';
            if (notif.type === 'like') { icon = '<i class="fas fa-heart" style="color:#e64646;"></i>'; text = `${escapeHtml(notif.fromUser)} лайкнул(а) ваш пост`; }
            else if (notif.type === 'comment') { icon = '<i class="fas fa-comment" style="color:#2a5885;"></i>'; text = `${escapeHtml(notif.fromUser)} оставил(а) комментарий`; }
            else if (notif.type === 'subscribe') { icon = '<i class="fas fa-user-plus" style="color:#4bb34b;"></i>'; text = `${escapeHtml(notif.fromUser)} подписался(ась) на вас`; }
            return `<div class="notification-item ${!notif.read ? 'unread' : ''}" data-user="${escapeHtml(notif.fromUser)}">
                        <div class="notification-avatar">${escapeHtml((notif.fromUser || '?').charAt(0).toUpperCase())}</div>
                        <div class="notification-icon">${icon}</div>
                        <div class="notification-content">
                            <div class="notification-text">${text}</div>
                            <div class="notification-time">${formatDate(notif.timestamp)}</div>
                        </div>
                    </div>`;
        }).join('');
        container.querySelectorAll('.notification-item').forEach(el => {
            el.onclick = () => { showProfile(el.dataset.user); setPanel('profile'); };
        });
    }
    
    function resizeImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    if (height > maxHeight) { width = (width * maxHeight) / height; height = maxHeight; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => resolve(blob), file.type, quality);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }
    
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
        });
    }
    
    async function processImages(files) {
        const results = [];
        for (let i = 0; i < Math.min(files.length, 3); i++) {
            const file = files[i];
            let compressedBlob = await resizeImage(file, 800, 800, 0.7);
            const base64 = await blobToBase64(compressedBlob);
            results.push(base64);
        }
        return results;
    }
    
    async function registerUser(username, password) {
        if (!username || !password) throw new Error("Заполните поля");
        if (username.length < 3) throw new Error("Имя минимум 3 символа");
        if (password.length < 4) throw new Error("Пароль минимум 4 символа");
        const userRef = doc(db, "users", username);
        const snap = await getDoc(userRef);
        if (snap.exists()) throw new Error("Пользователь уже существует");
        await setDoc(userRef, {
            username: username, displayName: username, password: password,
            bio: "", createdAt: new Date().toISOString(),
            isVerified: username === "OlegTube" || username === "Admin",
            followers: [], subscriptions: [], isOnline: true, lastSeen: new Date()
        });
        return { username };
    }
    
    async function loginUser(username, password) {
        const userRef = doc(db, "users", username);
        const snap = await getDoc(userRef);
        if (!snap.exists()) throw new Error("Пользователь не найден");
        if (snap.data().password !== password) throw new Error("Неверный пароль");
        await updateDoc(userRef, { isOnline: true, lastSeen: new Date() });
        return { username };
    }
    
    async function getAllPosts() {
        const snapshot = await getDocs(collection(db, "posts"));
        let posts = snapshot.docs.map(doc => ({
            id: doc.id, ...doc.data(),
            timestamp: doc.data().timestamp?.toDate() || new Date()
        }));
        posts.sort((a, b) => b.timestamp - a.timestamp);
        return posts;
    }
    
    async function addPost(text, imagesBase64) {
        if ((!text || !text.trim()) && (!imagesBase64 || imagesBase64.length === 0)) throw new Error("Напишите текст или добавьте фото");
        await addDoc(collection(db, "posts"), {
            author: currentUser.username, text: text?.trim() || "",
            timestamp: new Date(), likes: [], likesCount: 0, commentsCount: 0,
            imagesBase64: imagesBase64 || [], authorVerified: await isUserVerified(currentUser.username)
        });
        playSound('post');
        showToast('Пост опубликован! 🎉');
    }
    
    async function toggleLike(postId) {
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (!postSnap.exists()) return;
        const data = postSnap.data();
        const hasLiked = data.likes?.includes(currentUser.username);
        if (hasLiked) {
            await updateDoc(postRef, { likes: arrayRemove(currentUser.username), likesCount: Math.max(0, data.likesCount - 1) });
        } else {
            await updateDoc(postRef, { likes: arrayUnion(currentUser.username), likesCount: (data.likesCount || 0) + 1 });
            if (data.author !== currentUser.username) await addNotification(data.author, 'like', currentUser.username, postId);
            playSound('like');
        }
    }
    
    async function addComment(postId, text, imageBase64 = null) {
        if (!text.trim() && !imageBase64) return;
        await addDoc(collection(db, "posts", postId, "comments"), {
            author: currentUser.username, text: text.trim() || "",
            timestamp: new Date(), imageBase64: imageBase64 || null
        });
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (postSnap.exists()) {
            await updateDoc(postRef, { commentsCount: (postSnap.data().commentsCount || 0) + 1 });
            if (postSnap.data().author !== currentUser.username) await addNotification(postSnap.data().author, 'comment', currentUser.username, postId, text);
        }
        playSound('comment');
    }
    
    async function getComments(postId) {
        const snapshot = await getDocs(query(collection(db, "posts", postId, "comments"), orderBy("timestamp", "asc")));
        return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() }));
    }
    
    async function getUserPosts(username) {
        const snapshot = await getDocs(query(collection(db, "posts"), where("author", "==", username)));
        let posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), timestamp: doc.data().timestamp?.toDate() || new Date() }));
        posts.sort((a, b) => b.timestamp - a.timestamp);
        return posts;
    }
    
    async function toggleSubscribe(targetUsername) {
        if (targetUsername === currentUser.username) return;
        const userRef = doc(db, "users", currentUser.username);
        const userSnap = await getDoc(userRef);
        const subs = userSnap.data()?.subscriptions || [];
        const isSub = subs.includes(targetUsername);
        if (isSub) {
            await updateDoc(userRef, { subscriptions: arrayRemove(targetUsername) });
            await updateDoc(doc(db, "users", targetUsername), { followers: arrayRemove(currentUser.username) });
        } else {
            await updateDoc(userRef, { subscriptions: arrayUnion(targetUsername) });
            await updateDoc(doc(db, "users", targetUsername), { followers: arrayUnion(currentUser.username) });
            await addNotification(targetUsername, 'subscribe', currentUser.username);
            playSound('subscribe');
        }
        if (viewingProfile === targetUsername) await showProfile(targetUsername);
        if (currentPanel === 'profile' && (!viewingProfile || viewingProfile === currentUser.username)) await showMyProfile();
        await renderFeed();
    }
    
    async function renderComment(comment) {
        const authorProfile = await getUserProfile(comment.author);
        const avatarStyle = authorProfile.avatarBase64 ? `background-image: url(${authorProfile.avatarBase64});` : '';
        return `
            <div class="comment">
                <div class="comment-avatar" data-user="${comment.author}" style="${avatarStyle}">${!authorProfile.avatarBase64 ? escapeHtml(comment.author.charAt(0).toUpperCase()) : ''}</div>
                <div class="comment-content">
                    <div class="comment-author" data-user="${comment.author}">${escapeHtml(authorProfile.displayName)}</div>
                    <div class="comment-username">@${escapeHtml(comment.author)}</div>
                    ${comment.text ? `<div class="comment-text">${escapeHtml(comment.text)}</div>` : ''}
                    ${comment.imageBase64 ? `<div class="comment-image" data-image="${comment.imageBase64}"><img src="${comment.imageBase64}" alt="Comment image"></div>` : ''}
                    <div class="comment-date">${formatDate(comment.timestamp)}</div>
                </div>
            </div>
        `;
    }
    
    async function loadCommentsForPost(postId) {
        const comments = await getComments(postId);
        const commentsContainer = document.getElementById(`comments-${postId}`);
        if (!commentsContainer) return;
        if (comments.length === 0) {
            commentsContainer.innerHTML = '<div style="padding: 8px; color: #939393; font-size: 12px;">Нет комментариев. Будьте первым!</div>';
            return;
        }
        const commentHtmls = await Promise.all(comments.map(c => renderComment(c)));
        commentsContainer.innerHTML = commentHtmls.join('');
        commentsContainer.querySelectorAll('.comment-avatar, .comment-author').forEach(el => {
            const user = el.dataset.user;
            if (user && user !== currentUser.username) {
                el.onclick = () => { showProfile(user); setPanel('profile'); };
                el.style.cursor = 'pointer';
            }
        });
        commentsContainer.querySelectorAll('.comment-image').forEach(el => {
            el.onclick = () => {
                const viewer = document.createElement('div');
                viewer.className = 'image-viewer';
                viewer.innerHTML = `<img src="${el.dataset.image}" alt="Просмотр">`;
                viewer.onclick = () => viewer.remove();
                document.body.appendChild(viewer);
            };
        });
    }
    
    async function renderPost(post) {
        const authorProfile = await getUserProfile(post.author);
        const hasLiked = post.likes?.includes(currentUser.username);
        const showComments = commentsStates.get(post.id) || false;
        const images = post.imagesBase64 || [];
        const avatarStyle = authorProfile.avatarBase64 ? `background-image: url(${authorProfile.avatarBase64});` : '';
        
        const imagesHtml = images.length > 0 ? `<div class="post-images">${images.map(img => `<div class="post-image" data-image="${img}"><img src="${img}" alt="Post image" loading="lazy"></div>`).join('')}</div>` : '';
        
        return `
            <div class="post-card" data-post-id="${post.id}">
                <div class="post-header">
                    <div class="post-avatar" data-user="${post.author}" style="${avatarStyle}">${!authorProfile.avatarBase64 ? escapeHtml(post.author.charAt(0).toUpperCase()) : ''}</div>
                    <div class="post-author-info">
                        <div class="post-author-name" data-user="${post.author}">${escapeHtml(authorProfile.displayName)} ${post.authorVerified ? '<i class="fas fa-check-circle" style="color:#2a5885; font-size: 14px;"></i>' : ''}</div>
                        <div class="post-author-username">@${escapeHtml(post.author)}</div>
                        <div class="post-date">${formatDate(post.timestamp)}</div>
                    </div>
                </div>
                ${post.text ? `<div class="post-text">${escapeHtml(post.text)}</div>` : ''}
                ${imagesHtml}
                <div class="post-actions">
                    <div class="post-action like-btn" data-id="${post.id}"><i class="${hasLiked ? 'fas fa-heart' : 'far fa-heart'}"></i><span>${post.likesCount || 0}</span></div>
                    <div class="post-action show-comments-btn" data-id="${post.id}"><i class="far fa-comment"></i><span>${post.commentsCount || 0} комментариев</span></div>
                </div>
                <div class="comments-section" style="display: ${showComments ? 'block' : 'none'}">
                    <div id="comments-${post.id}" class="comments-list"></div>
                    <div class="add-comment">
                        <div class="add-comment-input-group">
                            <input type="text" id="comment-input-${post.id}" placeholder="Написать комментарий...">
                            <button class="comment-attach-btn" data-post="${post.id}"><i class="fas fa-image"></i></button>
                            <button class="comment-send-btn" data-post="${post.id}">Отправить</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    async function handleSendComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input?.value || '';
        if (!text.trim()) return;
        await addComment(postId, text);
        if (input) input.value = '';
        await loadCommentsForPost(postId);
        await loadPosts();
    }
    
    function attachPostHandlers(container) {
        if (!container) return;
        container.querySelectorAll('.post-avatar, .post-author-name').forEach(el => {
            const user = el.dataset.user;
            if (user && user !== currentUser.username) {
                el.onclick = (e) => { e.stopPropagation(); showProfile(user); setPanel('profile'); };
            }
        });
        container.querySelectorAll('.post-image').forEach(el => {
            el.onclick = () => {
                const viewer = document.createElement('div');
                viewer.className = 'image-viewer';
                viewer.innerHTML = `<img src="${el.querySelector('img').src}" alt="Просмотр">`;
                viewer.onclick = () => viewer.remove();
                document.body.appendChild(viewer);
            };
        });
        container.querySelectorAll('.like-btn').forEach(btn => {
            btn.onclick = async () => { await toggleLike(btn.dataset.id); await loadPosts(); };
        });
        container.querySelectorAll('.show-comments-btn').forEach(btn => {
            btn.onclick = async () => {
                const postId = btn.dataset.id;
                const currentState = commentsStates.get(postId) || false;
                commentsStates.set(postId, !currentState);
                const postCard = btn.closest('.post-card');
                if (postCard) {
                    const commentsSection = postCard.querySelector('.comments-section');
                    if (commentsSection) {
                        commentsSection.style.display = !currentState ? 'block' : 'none';
                        if (!currentState) await loadCommentsForPost(postId);
                    }
                }
            };
        });
        container.querySelectorAll('.comment-send-btn').forEach(btn => {
            btn.onclick = () => handleSendComment(btn.dataset.post);
        });
    }
    
    async function renderFeed() {
        const container = document.getElementById('postsContainer');
        if (!container) return;
        if (allPosts.length === 0) {
            container.innerHTML = '<div class="loading">Нет постов. Создайте первый!</div>';
            return;
        }
        const postHtmls = await Promise.all(allPosts.map(post => renderPost(post)));
        container.innerHTML = postHtmls.join('');
        attachPostHandlers(container);
    }
    
    async function showProfile(username) {
        viewingProfile = username;
        const container = document.getElementById('profileContent');
        if (!container) return;
        container.innerHTML = '<div class="loading">Загрузка...</div>';
        
        try {
            const userRef = doc(db, "users", username);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) { container.innerHTML = '<div class="loading">Пользователь не найден</div>'; return; }
            
            const userData = userSnap.data();
            const profile = await getUserProfile(username);
            const posts = await getUserPosts(username);
            const isOwn = username === currentUser.username;
            const isSubscribed = !isOwn && (userData.followers || []).includes(currentUser.username);
            
            let totalLikes = 0;
            posts.forEach(p => totalLikes += p.likesCount || 0);
            
            const avatarStyle = profile.avatarBase64 ? `background-image: url(${profile.avatarBase64});` : '';
            
            container.innerHTML = `
                <div class="profile-card">
                    ${!isOwn ? '<button class="profile-btn profile-back-btn" id="profileBackBtn"><i class="fas fa-arrow-left"></i> Назад</button>' : ''}
                    <div class="profile-cover">
                        ${isOwn ? '<button class="profile-cover-edit" id="editProfileBtn"><i class="fas fa-pen"></i> Редактировать профиль</button>' : ''}
                    </div>
                    <div class="profile-info">
                        <div class="profile-avatar-large" style="${avatarStyle}" id="avatarContainer">
                            ${!profile.avatarBase64 ? escapeHtml(username.charAt(0).toUpperCase()) : ''}
                            ${isOwn ? '<div class="avatar-edit-icon" id="changeAvatarBtn"><i class="fas fa-camera"></i></div>' : ''}
                        </div>
                        <div class="profile-name">${escapeHtml(profile.displayName)} ${userData.isVerified ? '<i class="fas fa-check-circle" style="color:#2a5885;"></i>' : ''}</div>
                        <div class="profile-username">@${escapeHtml(username)}</div>
                        ${profile.bio ? `<div class="profile-bio">${escapeHtml(profile.bio)}</div>` : ''}
                        <div class="profile-status">${formatLastSeen(userData.lastSeen)}</div>
                        <div style="font-size:12px; color:#939393; margin-top:8px;">Присоединился: ${new Date(userData.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat"><div class="profile-stat-number">${posts.length}</div><div class="profile-stat-label">записей</div></div>
                        <div class="profile-stat"><div class="profile-stat-number">${userData.followers?.length || 0}</div><div class="profile-stat-label">подписчиков</div></div>
                        <div class="profile-stat"><div class="profile-stat-number">${userData.subscriptions?.length || 0}</div><div class="profile-stat-label">подписок</div></div>
                        <div class="profile-stat"><div class="profile-stat-number">${totalLikes}</div><div class="profile-stat-label">лайков</div></div>
                    </div>
                    ${!isOwn ? `
                        <div class="profile-actions">
                            <button class="profile-btn ${isSubscribed ? 'subscribed' : ''}" id="subscribeProfileBtn"><i class="fas ${isSubscribed ? 'fa-check' : 'fa-user-plus'}"></i> ${isSubscribed ? 'Вы подписаны' : 'Подписаться'}</button>
                            <button class="profile-btn secondary" id="messageProfileBtn"><i class="fas fa-envelope"></i> Сообщение</button>
                        </div>
                    ` : ''}
                    <div class="profile-posts"><h4>Записи</h4><div id="profilePostsList"></div></div>
                </div>
            `;
            
            const postsContainerDiv = document.getElementById('profilePostsList');
            if (postsContainerDiv) {
                if (posts.length === 0) {
                    postsContainerDiv.innerHTML = '<div class="loading">Нет записей</div>';
                } else {
                    const postHtmls = await Promise.all(posts.map(post => renderPost(post)));
                    postsContainerDiv.innerHTML = postHtmls.join('');
                    attachPostHandlers(postsContainerDiv);
                }
            }
            
            if (!isOwn) {
                document.getElementById('profileBackBtn')?.addEventListener('click', () => { viewingProfile = null; setPanel('home'); });
                document.getElementById('subscribeProfileBtn')?.addEventListener('click', () => toggleSubscribe(username));
                document.getElementById('messageProfileBtn')?.addEventListener('click', async () => {
                    const chatId = await getOrCreateChatId(username);
                    openFullscreenChat(chatId, username);
                });
            }
            
            if (isOwn) {
                document.getElementById('editProfileBtn')?.addEventListener('click', () => openEditProfileModal());
                document.getElementById('changeAvatarBtn')?.addEventListener('click', () => changeAvatar());
            }
        } catch (error) {
            container.innerHTML = `<div class="loading">Ошибка загрузки профиля</div>`;
        }
    }
    
    async function changeAvatar() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    showToast('Файл слишком большой. Максимум 2MB');
                    return;
                }
                try {
                    const compressedBlob = await resizeImage(file, 300, 300, 0.8);
                    const base64 = await blobToBase64(compressedBlob);
                    await updateDoc(doc(db, "users", currentUser.username), { avatarBase64: base64 });
                    userProfilesCache.delete(currentUser.username);
                    showToast("Аватар обновлен!");
                    await showMyProfile();
                } catch(err) {
                    showToast("Ошибка загрузки аватара");
                }
            }
        };
        input.click();
    }
    
    function openEditProfileModal() {
        const modal = document.getElementById('editProfileModal');
        const displayNameInput = document.getElementById('editDisplayName');
        const usernameInput = document.getElementById('editUsername');
        const bioInput = document.getElementById('editBio');
        const warningDiv = document.getElementById('usernameWarning');
        const lastChangeInfo = document.getElementById('lastChangeInfo');
        
        getUserProfile(currentUser.username).then(async profile => {
            displayNameInput.value = profile.displayName;
            usernameInput.value = profile.username;
            bioInput.value = profile.bio || '';
            
            const userRef = doc(db, "users", currentUser.username);
            const userSnap = await getDoc(userRef);
            const lastChange = userSnap.data()?.lastUsernameChange?.toDate();
            
            if (lastChange) {
                const daysLeft = Math.ceil((30 * 24 * 60 * 60 * 1000 - (new Date() - lastChange)) / (24 * 60 * 60 * 1000));
                if (daysLeft > 0) {
                    lastChangeInfo.textContent = `Username можно будет сменить через ${daysLeft} дней`;
                    lastChangeInfo.style.color = '#e64646';
                } else {
                    lastChangeInfo.textContent = 'Username можно сменить';
                    lastChangeInfo.style.color = '#4bb34b';
                }
            } else {
                lastChangeInfo.textContent = 'Username можно сменить (раз в месяц)';
                lastChangeInfo.style.color = '#939393';
            }
        });
        
        modal.classList.add('active');
        
        const saveBtn = document.getElementById('saveProfileBtn');
        const cancelBtn = document.getElementById('cancelEditBtn');
        
        const saveHandler = async () => {
            const newDisplayName = displayNameInput.value.trim() || currentUser.username;
            const newUsername = usernameInput.value.trim();
            const newBio = bioInput.value.trim();
            
            if (newUsername && newUsername !== currentUser.username) {
                if (!/^[a-zA-Z0-9_]+$/.test(newUsername)) {
                    warningDiv.textContent = "Username может содержать только буквы, цифры и underscore";
                    return;
                }
                if (newUsername.length < 3) {
                    warningDiv.textContent = "Username должен быть не менее 3 символов";
                    return;
                }
            }
            
            try {
                await updateUserProfile(newDisplayName, newUsername, newBio);
                modal.classList.remove('active');
                await showMyProfile();
                await loadPosts();
                await loadChats();
            } catch(err) {
                warningDiv.textContent = err.message;
            }
        };
        
        const cancelHandler = () => {
            modal.classList.remove('active');
            warningDiv.textContent = '';
            saveBtn.removeEventListener('click', saveHandler);
            cancelBtn.removeEventListener('click', cancelHandler);
        };
        
        saveBtn.addEventListener('click', saveHandler);
        cancelBtn.addEventListener('click', cancelHandler);
    }
    
    async function showMyProfile() {
        viewingProfile = null;
        await showProfile(currentUser.username);
    }
    
    async function loadPosts() {
        allPosts = await getAllPosts();
        if (currentPanel === 'home') await renderFeed();
    }
    
    async function getOrCreateChatId(otherUsername) {
        const chatId = [currentUser.username, otherUsername].sort().join('_');
        const chatRef = doc(db, "chats", chatId);
        const snap = await getDoc(chatRef);
        if (!snap.exists()) {
            await setDoc(chatRef, { participants: [currentUser.username, otherUsername], lastMessage: "", lastMessageTime: new Date() });
        }
        return chatId;
    }
    
    async function sendMessage(chatId, text, imageBase64 = null) {
        if (!text.trim() && !imageBase64) return;
        await addDoc(collection(db, "chats", chatId, "messages"), {
            text: text.trim() || "", senderId: currentUser.username,
            timestamp: new Date(), imageBase64: imageBase64 || null
        });
        await updateDoc(doc(db, "chats", chatId), { lastMessage: text.trim() || "📷 Фото", lastMessageTime: new Date() });
        playSound('message');
    }
    
    function openFullscreenChat(chatId, partnerName) {
        const chatHTML = `
            <div id="fullscreenChat" class="chat-fullscreen">
                <div class="chat-fullscreen-header">
                    <button class="back-btn" id="closeFullscreenChat"><i class="fas fa-arrow-left"></i></button>
                    <div class="chat-user-info">
                        <div class="chat-user-name" id="chatPartnerName"></div>
                        <div class="chat-user-username" id="chatPartnerUsername"></div>
                        <div class="chat-user-status" id="chatUserStatus">загрузка...</div>
                    </div>
                </div>
                <div class="chat-messages-full" id="chatMessagesFull"></div>
                <div class="chat-input-full">
                    <div class="chat-input-wrapper">
                        <input type="text" id="chatMessageFull" placeholder="Сообщение...">
                        <button class="chat-attach-btn" id="chatAttachBtn"><i class="fas fa-image"></i></button>
                        <button id="sendChatFull"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', chatHTML);
        
        getUserProfile(partnerName).then(profile => {
            document.getElementById('chatPartnerName').textContent = profile.displayName;
            document.getElementById('chatPartnerUsername').textContent = `@${partnerName}`;
        });
        
        const messagesDiv = document.getElementById('chatMessagesFull');
        const input = document.getElementById('chatMessageFull');
        const sendBtn = document.getElementById('sendChatFull');
        const attachBtn = document.getElementById('chatAttachBtn');
        const statusDiv = document.getElementById('chatUserStatus');
        
        const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
        const unsubscribe = onSnapshot(q, async (snap) => {
            const messages = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const messageHtmls = await Promise.all(messages.map(async m => {
                const isMe = m.senderId === currentUser.username;
                const senderProfile = await getUserProfile(m.senderId);
                const time = m.timestamp?.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) || '';
                const hasImage = m.imageBase64;
                return `<div class="chat-message ${isMe ? 'out' : 'in'}">
                            <div class="chat-message-text"><strong>${escapeHtml(senderProfile.displayName)}</strong>: ${escapeHtml(m.text || '')}</div>
                            ${hasImage ? `<div class="chat-message-image" data-image="${m.imageBase64}"><img src="${m.imageBase64}" alt="Chat image"></div>` : ''}
                            <div style="font-size:10px; opacity:0.7; margin-top:4px;">${time}</div>
                        </div>`;
            }));
            messagesDiv.innerHTML = messageHtmls.join('');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            messagesDiv.querySelectorAll('.chat-message-image').forEach(el => {
                el.onclick = () => {
                    const viewer = document.createElement('div');
                    viewer.className = 'image-viewer';
                    viewer.innerHTML = `<img src="${el.dataset.image}" alt="Просмотр">`;
                    viewer.onclick = () => viewer.remove();
                    document.body.appendChild(viewer);
                };
            });
        });
        
        const sendMessageHandler = async () => {
            const text = input.value;
            if (!text.trim()) return;
            await sendMessage(chatId, text);
            input.value = '';
        };
        
        sendBtn.onclick = sendMessageHandler;
        input.onkeypress = (e) => { if (e.key === 'Enter') sendMessageHandler(); };
        attachBtn.onclick = () => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const processed = await processImages([file]);
                        await sendMessage(chatId, '', processed[0]);
                    } catch(err) { showToast('Ошибка загрузки фото'); }
                }
            };
            fileInput.click();
        };
        
        document.getElementById('closeFullscreenChat').onclick = () => {
            unsubscribe();
            document.getElementById('fullscreenChat').remove();
        };
    }
    
    async function loadChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        if (unsubscribeChats) unsubscribeChats();
        
        const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.username));
        unsubscribeChats = onSnapshot(q, async (snap) => {
            const chats = [];
            for (const docSnap of snap.docs) {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const other = chat.participants.find(p => p !== currentUser.username);
                chat.otherUser = other;
                const profile = await getUserProfile(other);
                chat.profile = profile;
                chats.push(chat);
            }
            chats.sort((a,b) => (b.lastMessageTime?.toDate() || 0) - (a.lastMessageTime?.toDate() || 0));
            
            if (chats.length === 0) {
                container.innerHTML = '<div class="loading">Нет диалогов</div>';
                return;
            }
            
            container.innerHTML = chats.map(chat => `
                <div class="chat-item" data-chat="${chat.id}" data-user="${chat.otherUser}">
                    <div class="chat-avatar" style="background-image: url(${chat.profile.avatarBase64 || ''}); background-size: cover;">${!chat.profile.avatarBase64 ? escapeHtml(chat.otherUser?.charAt(0).toUpperCase() || '?') : ''}</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(chat.profile.displayName)} <span class="chat-username">@${escapeHtml(chat.otherUser)}</span></div>
                        <div class="chat-last-msg">${escapeHtml(chat.lastMessage?.substring(0, 50) || 'Новый диалог')}</div>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.chat-item').forEach(el => {
                el.onclick = () => openFullscreenChat(el.dataset.chat, el.dataset.user);
            });
        });
    }
    
    async function searchUsers(searchTerm) {
        if (!searchTerm.trim()) return [];
        const usersRef = collection(db, "users");
        const snapshot = await getDocs(usersRef);
        const results = [];
        const term = searchTerm.toLowerCase();
        
        for (const docSnap of snapshot.docs) {
            const data = docSnap.data();
            const username = docSnap.id;
            const displayName = data.displayName || username;
            
            if (term.startsWith('@')) {
                const searchUsername = term.substring(1);
                if (username.toLowerCase().includes(searchUsername)) {
                    results.push({ username, displayName, avatarBase64: data.avatarBase64 });
                }
            } else {
                if (displayName.toLowerCase().includes(term) || username.toLowerCase().includes(term)) {
                    results.push({ username, displayName, avatarBase64: data.avatarBase64 });
                }
            }
        }
        return results.slice(0, 20);
    }
    
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('searchResults');
        let debounceTimeout;
        
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(async () => {
                const term = searchInput.value;
                if (!term.trim()) {
                    resultsDiv.innerHTML = '';
                    return;
                }
                resultsDiv.innerHTML = '<div class="loading">Поиск...</div>';
                const results = await searchUsers(term);
                if (results.length === 0) {
                    resultsDiv.innerHTML = '<div class="loading">Ничего не найдено</div>';
                } else {
                    resultsDiv.innerHTML = results.map(r => `
                        <div class="search-result-item" data-user="${r.username}">
                            <div class="search-result-avatar" style="background-image: url(${r.avatarBase64 || ''}); background-size: cover;">${!r.avatarBase64 ? escapeHtml(r.username.charAt(0).toUpperCase()) : ''}</div>
                            <div class="search-result-info">
                                <div class="search-result-name">${escapeHtml(r.displayName)}</div>
                                <div class="search-result-username">@${escapeHtml(r.username)}</div>
                            </div>
                        </div>
                    `).join('');
                    resultsDiv.querySelectorAll('.search-result-item').forEach(el => {
                        el.onclick = () => { showProfile(el.dataset.user); setPanel('profile'); };
                    });
                }
            }, 300);
        });
    }
    
    function setPanel(panel) {
        const panels = ['feedPanel', 'notificationsPanel', 'searchPanel', 'messagesPanel', 'profilePanel'];
        panels.forEach(p => document.getElementById(p)?.classList.add('hide'));
        if (panel === 'home') document.getElementById('feedPanel')?.classList.remove('hide');
        else if (panel === 'notifications') document.getElementById('notificationsPanel')?.classList.remove('hide');
        else if (panel === 'search') document.getElementById('searchPanel')?.classList.remove('hide');
        else if (panel === 'messages') document.getElementById('messagesPanel')?.classList.remove('hide');
        else if (panel === 'profile') document.getElementById('profilePanel')?.classList.remove('hide');
        
        currentPanel = panel;
        if (panel === 'home') renderFeed();
        if (panel === 'notifications') { renderNotifications(); markAllNotificationsAsRead(); }
        if (panel === 'messages') { document.getElementById('chatsList').style.display = 'block'; document.getElementById('newChatUsers').style.display = 'none'; loadChats(); }
        if (panel === 'profile') { if (viewingProfile && viewingProfile !== currentUser.username) showProfile(viewingProfile); else showMyProfile(); }
        
        ['menuHome', 'menuNotifications', 'menuSearch', 'menuMessages', 'menuProfile'].forEach(id => {
            document.getElementById(id)?.classList.remove('active');
        });
        document.getElementById(`menu${panel.charAt(0).toUpperCase() + panel.slice(1)}`)?.classList.add('active');
    }
    
    function updateImagePreviews() {
        const container = document.getElementById('imagesPreviewContainer');
        if (currentImageFiles.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = currentImageFiles.map((file, i) => `
            <div class="image-preview-item" data-index="${i}">
                <img src="${URL.createObjectURL(file)}" alt="Preview">
                <button class="remove-image-btn" data-index="${i}"><i class="fas fa-times"></i></button>
            </div>
        `).join('');
        document.querySelectorAll('.remove-image-btn').forEach(btn => {
            btn.onclick = () => { currentImageFiles.splice(parseInt(btn.dataset.index), 1); updateImagePreviews(); };
        });
    }
    
    document.getElementById('uploadImageBtn')?.addEventListener('click', () => document.getElementById('imageInput').click());
    document.getElementById('imageInput')?.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        currentImageFiles.push(...files.slice(0, 3 - currentImageFiles.length));
        updateImagePreviews();
        document.getElementById('imageInput').value = '';
    });
    
    document.getElementById('notificationsBell')?.addEventListener('click', () => setPanel('notifications'));
    document.getElementById('menuHome')?.addEventListener('click', () => setPanel('home'));
    document.getElementById('menuNotifications')?.addEventListener('click', () => setPanel('notifications'));
    document.getElementById('menuSearch')?.addEventListener('click', () => setPanel('search'));
    document.getElementById('menuMessages')?.addEventListener('click', () => setPanel('messages'));
    document.getElementById('menuProfile')?.addEventListener('click', () => { viewingProfile = null; setPanel('profile'); });
    document.getElementById('menuCreatePost')?.addEventListener('click', () => document.getElementById('createPostModal').classList.add('active'));
    
    document.getElementById('submitPostBtn')?.addEventListener('click', async () => {
        const text = document.getElementById('postText')?.value;
        if ((!text || !text.trim()) && currentImageFiles.length === 0) { alert('Напишите что-нибудь или добавьте фото'); return; }
        try {
            let imagesBase64 = [];
            if (currentImageFiles.length > 0) imagesBase64 = await processImages(currentImageFiles);
            await addPost(text, imagesBase64);
            document.getElementById('createPostModal').classList.remove('active');
            document.getElementById('postText').value = '';
            currentImageFiles = [];
            updateImagePreviews();
            await loadPosts();
            if (currentPanel === 'profile') await showMyProfile();
        } catch(error) { alert('Ошибка: ' + error.message); }
    });
    
    document.getElementById('cancelPostBtn')?.addEventListener('click', () => {
        document.getElementById('createPostModal').classList.remove('active');
        document.getElementById('postText').value = '';
        currentImageFiles = [];
        updateImagePreviews();
    });
    
    document.getElementById('newChatBtn')?.addEventListener('click', async () => {
        const chatsList = document.getElementById('chatsList');
        const newChatUsers = document.getElementById('newChatUsers');
        chatsList.style.display = 'none';
        newChatUsers.style.display = 'block';
        
        const userSnap = await getDoc(doc(db, "users", currentUser.username));
        const userData = userSnap.data();
        const followers = userData.followers || [];
        const subscriptions = userData.subscriptions || [];
        const friendsSet = new Set();
        followers.forEach(f => { if (subscriptions.includes(f)) friendsSet.add(f); });
        const friendsList = Array.from(friendsSet);
        
        const container = document.getElementById('usersList');
        if (friendsList.length === 0) {
            container.innerHTML = '<div class="loading">У вас пока нет друзей</div>';
            return;
        }
        
        const friendProfiles = await Promise.all(friendsList.map(async u => {
            const profile = await getUserProfile(u);
            return { username: u, ...profile };
        }));
        
        const render = (list) => {
            container.innerHTML = list.map(u => `
                <div class="chat-item" data-user="${u.username}">
                    <div class="chat-avatar" style="background-image: url(${u.avatarBase64 || ''}); background-size: cover;">${!u.avatarBase64 ? escapeHtml(u.username.charAt(0).toUpperCase()) : ''}</div>
                    <div><strong>${escapeHtml(u.displayName)}</strong><br><span style="font-size:11px; color:#939393;">@${escapeHtml(u.username)}</span><span class="friend-badge">друг</span></div>
                </div>
            `).join('');
            document.querySelectorAll('#usersList .chat-item').forEach(el => {
                el.onclick = async () => {
                    const target = el.dataset.user;
                    const chatId = await getOrCreateChatId(target);
                    openFullscreenChat(chatId, target);
                    chatsList.style.display = 'block';
                    newChatUsers.style.display = 'none';
                    loadChats();
                };
            });
        };
        
        render(friendProfiles);
        document.getElementById('searchUserInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            render(friendProfiles.filter(u => u.displayName.toLowerCase().includes(term) || u.username.toLowerCase().includes(term)));
        };
    });
    
    document.getElementById('backToChatsBtn')?.addEventListener('click', () => {
        document.getElementById('chatsList').style.display = 'block';
        document.getElementById('newChatUsers').style.display = 'none';
        loadChats();
    });
    
    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        if (currentUser) await updateDoc(doc(db, "users", currentUser.username), { isOnline: false, lastSeen: new Date() }).catch(() => {});
        if (unsubscribePosts) unsubscribePosts();
        if (unsubscribeChats) unsubscribeChats();
        if (unsubscribeNotifications) unsubscribeNotifications();
        document.getElementById('appScreen').style.display = 'none';
        document.getElementById('authScreen').style.display = 'block';
        currentUser = null;
    });
    
    const loginBtn = document.getElementById('loginBtn');
    const showRegisterBtn = document.getElementById('showRegisterBtn');
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');
    let isLoginMode = true;
    
    showRegisterBtn.onclick = () => {
        isLoginMode = !isLoginMode;
        loginBtn.innerText = isLoginMode ? "Войти" : "Зарегистрироваться";
        showRegisterBtn.innerText = isLoginMode ? "Зарегистрироваться" : "Назад к входу";
        authError.innerText = "";
        authSuccess.innerText = "";
    };
    
    async function handleAuth() {
        const username = document.getElementById('loginName')?.value.trim();
        const password = document.getElementById('loginPassword')?.value.trim();
        if (!username || !password) { authError.innerText = "Заполните все поля"; return; }
        try {
            if (isLoginMode) {
                await loginUser(username, password);
                playSound('login');
                showToast(`Добро пожаловать, ${username}! 🎉`);
            } else {
                await registerUser(username, password);
                authSuccess.innerText = "Регистрация успешна! Теперь войдите.";
                return;
            }
            currentUser = { username };
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            await loadPosts();
            setupSearch();
            await loadNotifications();
            const q = query(collection(db, "posts"));
            unsubscribePosts = onSnapshot(q, () => loadPosts());
            setPanel('home');
        } catch(err) { authError.innerText = err.message; }
    }
    
    loginBtn.onclick = handleAuth;
    document.getElementById('loginPassword')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); });
    
    let commentsStates = new Map();
    
    async function initTestPost() {
        const q = query(collection(db, "posts"), limit(1));
        const snap = await getDocs(q);
        if (snap.empty) {
            await addDoc(collection(db, "posts"), {
                author: "OlegTube", text: "Добро пожаловать в OlegTube! 🎉\n\nНовые возможности:\n✓ Редактор профиля (имя, аватарка, описание)\n✓ Поиск по имени и @username\n✓ Username можно менять раз в месяц\n✓ Отправка фото в комментариях и личных сообщениях\n✓ Уведомления о лайках, комментариях и подписках\n✓ Звуковые эффекты\n\nНаслаждайтесь общением!",
                timestamp: new Date(), likes: [], likesCount: 0, commentsCount: 0,
                imagesBase64: [], authorVerified: true
            });
        }
    }
    initTestPost();
</script>
